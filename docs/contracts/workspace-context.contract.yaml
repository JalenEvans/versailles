# Contract: workspace-context
# Owner: general-manager
# Gate: contract_gate — no implementation starts without a registered contract
# Validated by: scripts/validate-contracts.sh
# Canonical source: ~/.opencode/skills/contract-builder/references/contract.template.yaml

schema_version: 1
context: workspace-context

owns:
  - "Joint loading and JSON-parsing of the four top-level .versailles/ files — config.json, contracts.json, manifests.json, predicates.json — as a single unit (build-spec §2, §6)"
  - "The version gates on config.grammarVersion and config.schemaVersion with hard-error + upgrade-path behavior (build-spec §3.1)"
  - "config.schema.json machine-checkable validation against the ADR-0009 enum matrix"
  - "The VersaillesContext object (build-spec §6.5): config, contracts, manifests, predicates, parsedContracts, parseErrors, validationErrors, validationWarnings, isValid"
  - "The scoped extraction helper (build-spec §6.6): component/operation sub-object plus its errors/warnings"
  - "Staleness orchestration via versailles check with exit codes 0/1/2 (build-spec §8)"
  - "The shared-loader guarantee: every consuming component loads through this module (build-spec §6)"
  - "The manifests.json store entry shape: sourcePath (string; project-root-relative with POSIX separators when present, e.g. src/order.ts — never empty for covered entries; legacy entries lacking it preserved as-is) and methods (per-component map of method name → { static: boolean, params: string[], returnType?: string }, recorded where determinable, permissive low-confidence policy); every refreshed entry always carries the methods key — possibly {} — and only preserved legacy entries may lack it, the empty map being the first-class zero-methods signal the planner reads (build-spec §3.3, §7, VERSAILLES-25 follow-up)"
  - "Surfacing sourcePath and methods on ManifestsFile entries so downstream consumers (generate handler → emitter modulePaths + call shape) can use them"

purpose: |
  workspace-context owns the .versailles/ workspace as a versioned, jointly-loaded unit. The
  four top-level files are never valid to interpret in isolation — contracts reference manifests
  and predicates by name — so the loader reads them together, applies version gates on
  grammarVersion and schemaVersion (a mismatch is a hard error with an upgrade-path message,
  never a silent best-effort parse), parses and validates every expr against the full context,
  and returns one VersaillesContext with an aggregated isValid. It validates config against the
  ADR-0009 matrix, exposes the scoped extraction helper used by human review, and orchestrates
  the CI staleness check with distinct exit codes 0, 1, and 2. A single shared loader serves
  every component — no component re-implements loading — and the tool never invokes an LLM
  (ADR-0010). The loader also owns the manifests.json store entry shape: entries may carry
  sourcePath (the file a covered entry was extracted from) and per-component method metadata
  (methods), and it surfaces both on ManifestsFile entries so the generate handler and emitters
  can derive real module import paths and call shapes; legacy entries lacking them load and are
  preserved as-is. A refreshed entry's methods key may be the empty map {} — the first-class
  signal that the extractor knows the component has zero methods — and the loader surfaces it
  exactly as stored, never stripping or inventing it.

invariants:
  - "The four top-level .versailles/ files are always loaded together; no file is interpreted in isolation (build-spec §2)."
  - "Any load path that hits a grammarVersion or schemaVersion mismatch produces a hard error with an explicit upgrade-path message — never a silent best-effort parse (build-spec §3.1)."
  - "isValid is the aggregation of all hard errors: isValid === (parseErrors is empty and validationErrors is empty)."
  - "The loader never throws on malformed input — missing files, invalid JSON, malformed-shape files, and malformed expressions all surface as structured LoaderError/ParseError/ValidationError objects inside the returned context; no failure path raises an unstructured exception (ADR-0010)."
  - "Every consuming component reaches the workspace through the single shared loader; no component re-implements loading (build-spec §6)."
  - "config.language and config.testFramework always validate against the ADR-0009 enum matrix."
  - "A manifests.json store entry may carry sourcePath (project-root-relative with POSIX separators when present, e.g. src/order.ts — never an empty string for covered entries; legacy entries lacking it are preserved as-is) and methods (per-component map of method name → { static: boolean, params: string[], returnType?: string }, recorded where determinable under the permissive low-confidence policy). A refreshed entry always carries the methods key — possibly {} — and only preserved legacy entries may lack it; the loader surfaces a present empty map exactly as stored (VERSAILLES-25 follow-up)."
  - "The loader surfaces sourcePath and methods on every ManifestsFile entry so downstream consumers (generate handler → emitter modulePaths + call shape) can read them directly from the loaded context."

operations:
  load_workspace:
    requires:
      - "the directory contains all four versioned files: config.json, contracts.json, manifests.json, predicates.json"
    ensures:
      - "Returns a single VersaillesContext with config, contracts, manifests, predicates, parsedContracts (contract ID → AST), parseErrors, validationErrors, validationWarnings, and isValid"
      - "Version gates are checked before any processing; a mismatch returns a hard error with an upgrade-path message"
      - "ManifestsFile entries surface sourcePath and methods exactly as stored — the loader neither requires them on legacy entries nor strips them when present; a present empty methods map ({} — the refreshed-entry zero-methods signal) is surfaced unchanged (VERSAILLES-25 follow-up)"
      - "Never throws on missing files, invalid JSON, malformed-shape files, or version/config mismatches — every failure path returns the VersaillesContext carrying structured LoaderErrors of the fixed code set (VERSION_MISMATCH | MISSING_FILE | INVALID_JSON | CONFIG_INVALID | INVALID_SHAPE)"
      - "The call never throws an unstructured exception; semantic validation results (ValidationResult { valid, errors, warnings }) are aggregated into validationErrors/validationWarnings, never raised"
      - "No file is interpreted on its own"
    examples:
      - input: "load_workspace('.versailles') on a complete, version-matching workspace"
        output: "one VersaillesContext with parsedContracts populated and isValid reflecting parse + validation results"
      - input: "load_workspace('.versailles') with config.grammarVersion out of date"
        output: "hard error containing an explicit upgrade path; no context is returned"
  validate_config:
    requires:
      - "config is the parsed config.json content"
    ensures:
      - "language is accepted only when one of typescript | csharp | python"
      - "testFramework is accepted only when one of vitest | xunit | pytest"
      - "jest and any value outside the matrix is rejected as invalid configuration (ADR-0009)"
    examples:
      - input: "validate_config({ language: 'typescript', testFramework: 'vitest' })"
        output: "valid"
      - input: "validate_config({ language: 'typescript', testFramework: 'jest' })"
        output: "invalid — jest is outside the ADR-0009 matrix"
  extract_scoped:
    requires:
      - "context is a loaded VersaillesContext"
      - "component names a component in contracts.json; operation optionally names one of its operations"
    ensures:
      - "Returns just that component/operation sub-object plus its errors and warnings"
      - "Never returns the whole contracts.json contents"
      - "Never throws on degenerate or partial contexts (missing files, shape-invalid stores, unknown component/operation) — returns a ScopedView with an errors array, including a structured NOT_FOUND error for unknown targets"
    examples:
      - input: "extract_scoped(context, 'OrderService', 'placeOrder')"
        output: "the OrderService.placeOrder sub-object with its parse/validation errors and warnings only"
  check_staleness:
    requires:
      - "context is a loaded VersaillesContext"
      - "config.staleness.blockOnStale is a boolean"
    ensures:
      - "Non-empty parseErrors or validationErrors yields exit code 1"
      - "Stale stored sourceHash values yield exit code 2 when blockOnStale is true, and a warning report with exit code 0 when it is false"
      - "A clean workspace yields exit code 0"
    examples:
      - input: "check_staleness(contextWithStaleHashes, blockOnStale: false)"
        output: "warning report, exit 0"
      - input: "check_staleness(contextWithStaleHashes, blockOnStale: true)"
        output: "hard failure listing stale IDs, exit 2"

must:
  - "Read and JSON-parse all four top-level files together as one unit; never interpret any file on its own (build-spec §2)."
  - "Check config.grammarVersion and config.schemaVersion against the tool's supported versions before any processing; on mismatch return a hard error with an explicit upgrade-path message (build-spec §3.1)."
  - "Validate config against the ADR-0009 enum matrix: language accepts typescript | csharp | python and testFramework accepts vitest | xunit | pytest; reject jest and any value outside the matrix (ADR-0009)."
  - "Parse every expr string in contracts.json into an AST, collect structured parse errors, run the semantic validator against the full context, and aggregate everything into one VersaillesContext with an isValid flag (build-spec §6)."
  - "Expose the scoped extraction helper that returns a single component/operation sub-object plus its errors and warnings (build-spec §6.6)."
  - "Orchestrate versailles check: fail on non-empty parseErrors/validationErrors; recompute every stored sourceHash and compare; honor config.staleness.blockOnStale; exit 0 clean, 1 on parse/validation error, 2 on blocking staleness, and warn-with-0 when staleness is non-blocking (build-spec §8)."
  - "Be the single shared loader: every consuming component (CLI commands, review UI, CI lint, generator) loads the workspace through this module, never re-implementing loading (build-spec §6)."
  - "Return every failure as structured errors inside the returned context or scoped view — never throw — for missing files (MISSING_FILE), invalid JSON (INVALID_JSON), malformed shapes (INVALID_SHAPE, shape-guard pass), version/config mismatches (VERSION_MISMATCH | CONFIG_INVALID), malformed expressions (ParseError), and unknown scoped targets (NOT_FOUND) (build-spec §6, ADR-0010)."
  - "Acknowledge the manifests.json store entry shape: sourcePath (string; project-root-relative with POSIX separators when present, e.g. src/order.ts — never empty for covered entries; legacy entries lacking it preserved as-is) and methods (per-component map of method name → { static: boolean, params: string[], returnType?: string }, recorded where determinable, permissive low-confidence policy); a refreshed entry always carries the methods key — possibly {} — with only preserved legacy entries allowed to lack it (build-spec §3.3, §7, VERSAILLES-25 follow-up)."
  - "Surface sourcePath and methods on ManifestsFile entries so downstream consumers (generate handler → emitter modulePaths + call shape) can use them directly from the loaded context."

must_not:
  - "Must not interpret any of the four top-level files in isolation — they are versioned together and loaded as one unit (build-spec §2)."
  - "Must not silently best-effort parse on a grammarVersion or schemaVersion mismatch — it is a hard error with an upgrade-path message (build-spec §3.1)."
  - "Must not accept language or testFramework values outside the ADR-0009 enum matrix — jest is rejected, vitest is accepted (ADR-0009)."
  - "Must not let consumers re-implement loading — the shared loader is the only path into the context (build-spec §6)."
  - "Must not return a whole file from scoped extraction — always the single sub-object plus its errors (build-spec §6.6)."
  - "Must not fail versailles check on staleness when config.staleness.blockOnStale is false — it warns and exits 0 (build-spec §8)."
  - "Must not throw unstructured exceptions on malformed input — missing/invalid/malformed files, malformed exprs, and degenerate contexts always produce structured error objects (ADR-0010)."
  - "Must not require sourcePath or methods on any manifests.json entry — legacy entries lacking them load normally and are preserved as-is; recording them is manifest-extraction's job, not the loader's. Must not strip or invent a methods key either — a present empty map ({} — the refreshed-entry zero-methods signal) is surfaced exactly as stored (VERSAILLES-25 follow-up)."
  - "Must not invoke an LLM anywhere in loading or checking (ADR-0010)."

can:
  - "May surface non-blocking validationWarnings to consumers (for example reviewer-awareness surfaces)."
  - "May emit a warning report (such as a CI annotation) when staleness is detected but blockOnStale is false."
  - "May cache or memoize loaded contexts within a single process as an optimization, provided the shared loader remains the only entry point."
  - "May expose sourcePath and methods as optional typed fields on ManifestsFile entries, tolerated by the shape guard when absent; an empty methods map ({}) on a refreshed entry is a valid, meaningful value the shape guard accepts (VERSAILLES-25 follow-up)."

limits:
  - "No implementation of the grammar, parser, or validator rules themselves — contract-language owns those; this context aggregates results."
  - "No manifest derivation from source — manifest-extraction owns that."
  - "No test-case planning or test emission — deterministic-generation owns that."
  - "No review merge or approval write-back to contracts.json — review owns that; this context supplies the scoped view only."
  - "No recording or derivation of sourcePath or method metadata — manifest-extraction writes those fields; this context only loads and surfaces them."
  - "No LLM client, prompt templates, or in-tool LLM invocation (ADR-0010)."

asserts:
  - "assert: load_workspace returns isValid === (parseErrors is empty and validationErrors is empty)."
  - "assert: validate_config accepts vitest and typescript and rejects jest and any value outside the matrix."
  - "assert: every loader path that encounters a version mismatch returns a hard error containing an upgrade-path message."
  - "assert: extract_scoped returns at most the requested sub-object and never the whole contracts.json content."
  - "assert: check_staleness exits 0 on clean, 1 on parse/validation errors, 2 on blocking staleness, and 0 with a warning when staleness is non-blocking."
  - "assert: load_workspace never throws on missing/invalid-JSON/malformed-shape files — it returns a VersaillesContext with structured LoaderErrors of the fixed code set (VERSION_MISMATCH | MISSING_FILE | INVALID_JSON | CONFIG_INVALID | INVALID_SHAPE)."
  - "assert: extract_scoped never throws on degenerate/partial contexts — it returns a ScopedView with an errors array, and reports an unknown component/operation as a structured NOT_FOUND error."
  - "assert: the semantic validation pass never throws on arbitrary ASTs/contexts — it returns ValidationResult { valid, errors, warnings } and the loader appends its errors to validationErrors and its warnings to validationWarnings (ADR-0010)."
  - "assert: load_workspace surfaces sourcePath and methods on ManifestsFile entries when present in manifests.json, and legacy entries lacking them load unchanged without INVALID_SHAPE errors."
  - "assert: load_workspace surfaces a present empty methods map ({} — the refreshed-entry zero-methods signal) unchanged on ManifestsFile entries — never stripped, never INVALID_SHAPE (VERSAILLES-25 follow-up)."

