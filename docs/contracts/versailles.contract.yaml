# Contract: versailles
# Owner: general-manager
# Gate: contract_gate — no implementation starts without a registered contract
# Validated by: scripts/validate-contracts.sh
# Canonical source: ~/.opencode/skills/contract-builder/references/contract.template.yaml

schema_version: 1
context: versailles

owns:
  - "The CLI command surface (build-spec §12): init, extract-manifests, validate, check, generate — the exact set of five subcommands, with no review/register-predicate/verify-purity/remind-unverified subcommands (ADR-0012, ADR-0013)"
  - "Command routing and argument parsing: mapping argv to the five subcommands, positional/flag validation, and usage-error exit paths"
  - "The deterministic machine-readable output surface (build-spec §10): stable JSON output shape { ok: boolean, errors: [...], warnings: [...], exitCode: number } with structured errors — never unstructured throws"
  - "Stable exit-code semantics at the process boundary: 0 success/no staleness, 1 validation/parse errors present, 2 blocking staleness — mechanically computed by workspace-context's check_staleness and surfaced here (build-spec §8)"
  - "The gate that blocks generate from running against an invalid context and routes the failure to structured output instead (build-spec §9)"
  - "validate --verbose: raw expr + parsed AST per clause as a parser-sanity check (ADR-0012 folded the review-view into validate --verbose)"

purpose: |
  versailles is the deterministic, machine-readable CLI surface of the tool. It exposes exactly
  five subcommands — init, extract-manifests, validate, check, generate — that parse argv, route
  to the owning context for each capability, and respond with stable JSON of the shape
  { ok, errors, warnings, exitCode } plus one of three exit codes (0 clean, 1 parse/validation
  errors, 2 blocking staleness). The tool never invokes an LLM (ADR-0010). Every failure surface,
  from unknown commands to blocking staleness, is a structured error, never an unstructured throw,
  so the tool is deterministic and offline-testable. The authored file is the artifact; the git
  commit is the approval (ADR-0003, ADR-0012); no in-tool review or approval ceremony exists.

invariants:
  - "Every command path exits with one of 0, 1, or 2 — no other exit codes exist on any path (build-spec §8, §10)."
  - "Machine output is deterministic: same argv plus same workspace yields byte-identical JSON — no timestamps, randomness, or environment-dependent content (build-spec §10, ADR-0002)."
  - "The CLI never invokes an LLM: no LLM client, no prompting logic, no retry loop anywhere in the command surface (ADR-0010)."
  - "No failure path raises an unstructured exception — usage errors, load errors, parse/validation errors, and staleness all surface as structured JSON."
  - "validate, check, and generate load the workspace exclusively through the workspace-context shared loader; no command re-implements loading (build-spec §6)."
  - "Exit code 2 is reserved exclusively for blocking staleness (build-spec §8); usage and validation errors never use it."
  - "The command surface contains exactly five subcommands (init, extract-manifests, validate, check, generate); no review, register-predicate, verify-purity, or remind-unverified subcommand exists (ADR-0012, ADR-0013)."

operations:
  route_command:
    requires:
      - "argv is the raw command-line argument vector (process.argv minus node and script)"
    ensures:
      - "The first positional argument routes to exactly one of: init | extract-manifests | validate | check | generate"
      - "An unknown first positional returns a structured usage error with exit code 1 — never a raw throw and never exit code 2"
      - "Commands accept no unexpected positional arguments; unexpected positionals are a structured usage error with exit code 1"
    examples:
      - input: "route_command(['check'])"
        output: "routes to the check handler"
      - input: "route_command(['author', 'OrderService'])"
        output: "structured usage error { ok: false, errors: [{ code: 'UNKNOWN_COMMAND', ... }], warnings: [], exitCode: 1 } — no author subcommand exists"
      - input: "route_command(['review', 'OrderService'])"
        output: "structured usage error — review is not a subcommand (ADR-0012)"
  run_validate:
    requires:
      - "the workspace is loadable (a load failure itself surfaces as a structured error, never a throw)"
    ensures:
      - "Runs the parser and semantic validator across all of contracts.json (including declarative predicate verification per build-spec §3.4) via the shared loader and prints a structured report of the shape { ok, errors, warnings, exitCode }"
      - "Exits 0 when the workspace is valid (no parse or validation errors) and 1 when hard errors are present (build-spec §10, §12)"
      - "With --verbose, additionally emits raw expr strings alongside their parsed AST per clause as a parser-sanity check (ADR-0012)"
    examples:
      - input: "run_validate() against a workspace with a parse error"
        output: "{ ok: false, errors: [ParseError...], warnings: [], exitCode: 1 }"
  run_check:
    requires:
      - "the workspace is loadable"
    ensures:
      - "Delegates the staleness computation to workspace-context's check_staleness and surfaces its result as the process exit code: 0 clean, 1 parse/validation errors, 2 blocking staleness when blockOnStale is true, 0 with a warning report when staleness is non-blocking (build-spec §8)"
      - "The structured report includes the stale IDs when blocking staleness is detected"
    examples:
      - input: "run_check() with stale hashes and blockOnStale true"
        output: "{ ok: false, errors: [{ code: 'STALE', ids: [...] }], warnings: [], exitCode: 2 }"
      - input: "run_check() with stale hashes and blockOnStale false"
        output: "{ ok: true, errors: [], warnings: [{ code: 'STALE', ids: [...] }], exitCode: 0 }"
  run_generate:
    requires:
      - "the workspace is loadable"
    ensures:
      - "Runs the deterministic generator only against a context where isValid is true; on success exits 0 and delegates emission to deterministic-generation (build-spec §9)"
      - "When isValid is false, writes no test files, surfaces the structured errors with exit code 1, and never runs generation (build-spec §9, §10)"
    examples:
      - input: "run_generate() against an invalid context"
        output: "{ ok: false, errors: [validation errors...], warnings: [], exitCode: 1 }; generated/ untouched"
  run_init:
    requires:
      - "the target directory is writable"
    ensures:
      - "Scaffolds .versailles/ with empty/default files (config.json, contracts.json with empty predicates map, manifests.json) and exits 0 on success (build-spec §2, §12)"
      - "A failure to scaffold returns a structured error with exit code 1 — never a raw throw"
    examples:
      - input: "run_init() in an empty project"
        output: ".versailles/ scaffolded with default files; exit 0"
  run_extract_manifests:
    requires:
      - "the workspace is loadable"
    ensures:
      - "Routes to manifest-extraction's extract_manifests_command behavior and surfaces its result as structured output (build-spec §7, §12)"
      - "A failure returns a structured error with exit code 1; success returns ok with exit code 0"
    examples:
      - input: "run_extract_manifests() with an unwritable manifests.json"
        output: "{ ok: false, errors: [structured error...], warnings: [], exitCode: 1 }"
  emit_machine_output:
    requires:
      - "result is a structured result object of the shape { ok: boolean, errors: [...], warnings: [...], exitCode: number }"
    ensures:
      - "Serializes the result as deterministic JSON (stable key order, no timestamps or environment-dependent content) on stdout"
      - "Sets the process exit code to result.exitCode, which is always one of 0, 1, or 2"
      - "Never prints unstructured stack traces or non-JSON noise to stdout where CI parses machine output"
    examples:
      - input: "emit_machine_output({ ok: false, errors: [e], warnings: [], exitCode: 1 })"
        output: "stable JSON on stdout; process exits 1"

must:
  - "Expose exactly the build-spec §12 command surface: init, extract-manifests, validate, check, generate; no review, register-predicate, verify-purity, or remind-unverified subcommand exists (ADR-0012, ADR-0013)."
  - "Route argv deterministically to the five subcommands and reject unknown commands or malformed arguments with a structured usage error and exit code 1 — never a raw stack trace and never exit code 2."
  - "Produce the stable machine-readable output shape { ok: boolean, errors: [...], warnings: [...], exitCode: number } on every command and serialize it as deterministic JSON (build-spec §10)."
  - "Return every failure — usage errors, load errors, parse/validation errors, and blocking staleness — as structured errors, never unstructured throws (build-spec §10, ADR-0010)."
  - "Surface the exit code computed by workspace-context's check_staleness at the process boundary: 0 clean, 1 parse/validation errors, 2 blocking staleness when blockOnStale is true, and 0 with a warning report when staleness is non-blocking (build-spec §8)."
  - "Gate generate on context.isValid — refuse to generate and write no test files when invalid, surfacing structured errors with exit code 1 (build-spec §9)."
  - "Load the workspace exclusively through the workspace-context shared loader in every command that needs it; no command re-implements loading (build-spec §6)."
  - "Keep every command deterministic and offline-testable: no LLM client, no prompting, no network dependency, no retry loop anywhere in the surface (ADR-0010)."
  - "With validate --verbose, surface raw expr strings alongside their parsed AST per clause as a parser-sanity check (ADR-0012)."

must_not:
  - "Must not invoke an LLM anywhere in the command surface — no LLM client, no prompt templates, no retry loop that calls an LLM (ADR-0010)."
  - "Must not expose review, register-predicate, verify-purity, remind-unverified, or author subcommands (ADR-0010, ADR-0012, ADR-0013)."
  - "Must not throw unstructured exceptions on any path — malformed arguments, unknown commands, load failures, parse/validation errors, and staleness all surface as structured JSON errors (build-spec §10)."
  - "Must not exit with a code outside {0, 1, 2}, and must not use 2 for anything other than blocking staleness (build-spec §8)."
  - "Must not emit nondeterministic output — no timestamps, randomness, or environment-dependent content in machine-readable output (build-spec §10, ADR-0002)."
  - "Must not run generate against an invalid context and must not write test files when generation is blocked (build-spec §9)."
  - "Must not re-implement loading, staleness computation, manifest extraction, or generation mechanics — those are owned by workspace-context, manifest-extraction, and deterministic-generation respectively; this context routes and surfaces (build-spec §6)."
  - "Must not print unstructured stack traces or non-JSON noise to stdout where CI parses the machine output."
  - "Must not implement any in-tool approval or review ceremony — the git commit is the approval (ADR-0003, ADR-0012)."

can:
  - "May print human-readable diagnostics or progress to stderr, provided stdout remains stable machine-readable JSON."
  - "May accept flags that forward to owned contexts (for example --prune for extract-manifests)."
  - "May include per-command usage hints inside structured usage errors."
  - "May expose a pretty-print or verbosity flag (such as --verbose) as long as the default output shape and exit codes stay stable."

limits:
  - "No in-tool LLM authoring, prompting, or retry loop (ADR-0010)."
  - "No staleness computation mechanics — workspace-context's check_staleness computes hash comparisons and exit codes; this context surfaces them (build-spec §8)."
  - "No grammar, parsing, or semantic validation internals — contract-language owns those; this context consumes results via the shared loader."
  - "No manifest extraction from source and no sourceHash computation — manifest-extraction owns those; extract-manifests routes to it."
  - "No test-case planning or test-file emission — deterministic-generation owns those; generate gates on isValid and surfaces results."
  - "No review view rendering, approval, or merge — retired by ADR-0012; parser-sanity view is folded into validate --verbose."
  - "No test execution or running of generated tests."
  - "No predicate registration CLI — predicates are declared inline in contracts.json (ADR-0013)."

asserts:
  - "assert: every command path exits with one of 0, 1, or 2."
  - "assert: running the same argv twice against the same workspace produces byte-identical stdout JSON."
  - "assert: an unknown command or malformed argument exits 1 with a structured usage error, never a raw throw."
  - "assert: validate/check on a workspace with parse or validation errors exits 1; check on blocking staleness exits 2; clean exits 0; non-blocking staleness exits 0 with a warning."
  - "assert: generate against an invalid context writes zero files under generated/ and exits 1."
  - "assert: no code path in the CLI invokes an LLM (no LLM call sites in the tool, per ADR-0010 confirmation)."
  - "assert: the command surface contains exactly the five build-spec §12 subcommands (init, extract-manifests, validate, check, generate) and no review/register-predicate/verify-purity/remind-unverified/author subcommand."

