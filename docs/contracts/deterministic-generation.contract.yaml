# Contract: deterministic-generation
# Owner: maintainer
# Gate: contract_gate — no implementation starts without a registered contract
# Validated by: scripts/validate-contracts.sh
# Canonical source: contract-builder template

schema_version: 1
context: deterministic-generation

owns:
  - "The framework-agnostic test-case IR and case planning (build-spec §9.1–§9.2): boundary values, equivalence partitions, precondition-violation, postcondition-satisfaction, per-component invariant tests, expected-rejection cases"
  - "The rejection idiom application from config.json (default throws) on both the §9.1 violation surface and the §9.2 expected-rejection surface (ADR-0007)"
  - "Traceability: per-test traceability comments and generated/coverage.json clause-to-test mapping (build-spec §9.3)"
  - "The emitter plugin seam selected by config.testFramework — vitest (*.test.ts), xUnit (*.Tests.cs), pytest (test_*.py), the full ADR-0009 matrix (ADR-0008, ADR-0009)"
  - "Full-file idempotent regeneration of the tool-owned generated/ directory (build-spec §9.4)"
  - "Predicate-aware planning: predicate-call preconditions produce at least one violation case via deterministic synthesis (registered predicate paramTypes + registry example hints), or an explicit non-silent warning when genuinely unplannable (build-spec §9.1)"
  - "Predicate-aware valid-input synthesis: valid params satisfy registered predicates deterministically, never silently generating inputs the operation would reject (build-spec §9.1)"
  - "Emitter call-shape awareness: shape-aware invocation (instance → new <Component>().<op>(...), static → <Component>.<op>(...), void-return acceptance without return assertions, and accept/invariant assertions on void-returning operations bound to the component INSTANCE — never the void return value) driven by manifest method metadata (build-spec §9.4, VERSAILLES-26); a STATIC void operation with assertions renders the bare call without the instance.<field> assertion, since the static call never touches a constructed instance (VERSAILLES-26 follow-up)"
  - "Resolvable emitter module paths: import specifiers derived from the project-root-relative manifest sourcePath (POSIX separators) computed relative to the generated file's directory, so the emitted import resolves to the real source file; deterministic fallback when sourcePath is absent (build-spec §9.4, VERSAILLES-24)"
  - "Non-silent planning warnings for unrenderable operations: a planned operation with no matching method metadata and no resolvable source method surfaces a non-blocking UNPLANNABLE_OPERATION warning (same tier as PREDICATE_UNPLANNABLE — CliResult.warnings, exit 0) and is never emitted as an unrunnable static call (build-spec §9.1, VERSAILLES-25); the guard fires whenever the component's entry carries a methods key — empty or not — missing the planned op, and only an entry lacking the methods key entirely (a preserved legacy entry the extractor never touched) keeps the legacy default (VERSAILLES-25 follow-up)"
  - "Seeded PBT emission (ADR-0017): opt-in property-block planning and emission (vitest + fast-check first behind the ADR-0009 seam) — per-param arbitraries derived from typeRefs + numeric constraint bounds, contract clauses codegen'd into the test as the oracle, seed literals derived from the context (a 32-bit stable hash of the block's clause IDs + grammar version) or the explicit config.propertyBased.seed override, additive to the concrete cases; the v1 default output is byte-identical when disabled"
  - "Joint sampling for multi-param guard oracles (VERSAILLES-165): equality-mirror — a guard oracle p1 == p2 / p1 === p2 (bothSideFieldRef, both operands operation params) generates p1 from its arbitrary and mirrors the value to p2 (the emitted callback contains `const p2 = p1;`), no filter, zero filter sparsity — and record-based coupled sampling — coupled numeric compounds over multiple params (e.g. `a >= 0 and b >= 0 and a + b <= 100`) derive per-param bounds including cross-param propagation from sum/difference leaves, then sample a bounded joint region via `fc.record({ a: ..., b: ... }).filter(({ a, b }) => <oracle>(a, b))`; a bothSideFieldRef equality with a manifest-FIELD operand (e.g. `status == newStatus`) routes to the emitter's FIELD-BOUND layout — op-params only, the component instance bound, the field mapped to `instance.<field>` in the assertion, no mirror/record/filter; `PROPERTY_UNPLANNABLE` is retained only for genuinely unrepresentable shapes (non-mirrorable equality, equality-of-sums, field-operand couplings, inverted derived bounds, zero-param field-field equalities, unboundable couplings, unrenderable oracles, component-typed params)"
  - "Totality of emission (ADR-0021): emitted output either type-checks under the documented baseline strict tsconfig (including allowImportingTsExtensions) or a non-silent warning is surfaced — never silently type-broken output; the guarantee is scoped to that documented baseline tsconfig, not arbitrary consumer configs"
  - "Explicitly-typed PBT oracle lambdas (ADR-0021): oracle lambdas emitted into property blocks carry explicit param types from the contract/manifest types — (sku: string) => ..., (price: number) => ..., (balance: number) => ... — never implicit any; container op-param typeRefs render recursively (list<X> → X[], optional<X> → X | undefined), and an op-param with no renderable TS form even after the container extension (e.g. list<Order>) surfaces EMISSION_UNRENDERABLE and its oracles are omitted from the block (VERSAILLES-175)"
  - "Manifest-access-aware field reachability (ADR-0021): non-public (private/protected) or readonly fields are reached via a deliberate, documented `(instance as any).<field>` cast decided from the manifest's per-field access/readonly data; public fields are never cast — the standard white-box testing idiom"

purpose: |
  deterministic-generation is the core value proposition of Versailles: a pure, deterministic
  compiler from approved contracts to test files. Given the same validated context it produces a
  byte-identical test suite every run — no randomness at generation time, no timestamps, no LLM
  (ADR-0002, re-scoped to generation-time by ADR-0017; ADR-0010). It plans a framework-agnostic
  test-case IR covering boundary values, equivalence
  partitions, precondition-violation cases, postcondition-satisfaction cases, per-component
  invariant tests, and expected-rejection cases for the postcondition/invariant interaction bug
  class. Seeded property-based test (PBT) emission is an opt-in, additive capability (ADR-0017):
  when config.propertyBased.enabled is true the generator additionally plans property blocks
  (vitest + fast-check first behind the ADR-0009 seam) whose per-param arbitraries derive from
  typeRefs and numeric constraint bounds, whose contract clauses are codegen'd into the test as
  the oracle, and whose runs are pinned by a seed literal derived from the context (a 32-bit
  stable hash of the block's clause IDs + grammar version) or an explicit override — generation
  stays a pure function and regeneration stays byte-identical even though the emitted test
  explores many inputs at run time. Multi-param guard oracles (e.g. `p1 == p2`, or coupled
  numeric compounds like `a >= 0 and b >= 0 and a + b <= 100`) are planned with joint sampling
  (VERSAILLES-165): the equality-mirror strategy emits `const p2 = p1;` so both params derive
  from one arbitrary with zero filter sparsity, record-based coupled sampling derives
  cross-param bounds from sum/difference leaves then filters a bounded joint region, and a
  bothSideFieldRef equality with a manifest-FIELD operand (e.g. `status == newStatus`) uses
  the FIELD-BOUND layout — op-params only, the component instance bound, the field mapped to
  `instance.<field>` in the assertion — the valid region stays healthy, never
  filter-sparse, never a hang; only genuinely unrepresentable shapes (non-mirrorable
  equality, equality-of-sums, field-operand couplings, inverted derived bounds, zero-param
  field-field equalities, unboundable couplings, unrenderable oracles, component-typed
  params) surface `PROPERTY_UNPLANNABLE`. Predicate-call preconditions (e.g. isPositive(amount)) are planned too: at least one
  deterministic violation case per predicate call, or an explicit non-silent warning — never a
  silent zero — and valid-input synthesis is predicate-aware so a registered predicate guard
  never receives a value it rejects. Emitters render shape-aware calls from manifest method
  metadata (instance vs static vs void-return) and import components via sourcePath-derived
  module paths. Rejection assertions on both the violation and expected-rejection surfaces use the
  rejection idiom configured in config.json (default throws, ADR-0007). Every generated test
  carries a traceability comment and generated/coverage.json maps clause IDs to test IDs so
  zero-coverage clauses are detectable. Output is rendered by per-framework emitter plugins (vitest, xUnit, pytest) into the fully tool-owned generated/ directory via idempotent, full-file
  regeneration.

invariants:
  - "Generation runs only against a context where isValid is true; invalid contexts never produce test files."
  - "The generator is a pure function of the context at generation time: same context in, byte-identical output out — no randomness in the generation pipeline, no timestamps, no LLM (ADR-0002, re-scoped to generation-time by ADR-0017); run-time randomness in emitted PBT blocks is seed-pinned (ADR-0017)."
  - "Every generated test carries a traceability comment; generated/coverage.json maps every contract clause ID to its generated test IDs, leaving zero-coverage clauses detectable."
  - "The tool never invokes an LLM at generation time or anywhere in the tool (ADR-0010)."
  - "No framework-specific rendering logic lives in the core — all rendering is behind the emitter plugin seam (ADR-0008)."
  - "Every predicate-call precondition yields at least one planned violation case or an explicit, non-silent warning — never a silent zero-case outcome (build-spec §9.1)."
  - "Valid-input synthesis is predicate-aware: a param guarded by a registered predicate always receives a value the predicate accepts when the registry provides the means (paramTypes + example hints); the planner never emits an input the operation is known to reject as a 'valid' input."
  - "Emitted calls match the manifest method metadata: instance methods are invoked on a constructed instance, static methods on the component, params passed positionally in declared order, and void-return accept cases carry no return-value assertion (build-spec §9.4)."
  - "Accept/invariant cases on void-returning INSTANCE operations assert component instance state — const instance = new <Component>(); instance.<field> = <captured>; instance.<op>(...); expect(instance.<field>)... — never the void return value; captured non-param inputs are seeded onto the bound instance before the call because assertion literals derive from the planner's captured pre-state, which a fresh instance does not carry (build-spec §9.4, VERSAILLES-26). A STATIC void operation with assertions renders the bare call with no instance.<field> assertion — the static call never touches a constructed instance, so asserting on one would be misleading (VERSAILLES-26 follow-up)."
  - "A planned operation with no matching method metadata and no resolvable source method surfaces a non-silent UNPLANNABLE_OPERATION warning in the suite warnings (same non-blocking tier as PREDICATE_UNPLANNABLE — CliResult.warnings, exit 0) and never emits an unrunnable static options-object call for it (build-spec §9.1, VERSAILLES-25). The guard fires whenever the component's entry carries a methods key — empty or not — missing the planned op: an empty methods map ({} on a refreshed entry) still triggers the warning for every planned op, because it is the first-class 'we know this component has zero methods' signal; only an entry lacking the methods key entirely (preserved legacy, extractor never touched) keeps the legacy default (VERSAILLES-25 follow-up)."
  - "Emitted module import specifiers derived from a manifest sourcePath resolve to the real source file from the generated file's directory — resolvability is required, not merely a matching extension or suffix (build-spec §9.4, VERSAILLES-24)."
  - "PBT blocks are emitted only when config.propertyBased.enabled is true; with enabled false (or absent) the emitted suite is byte-identical to the v1 concrete-case output — no property blocks, no new imports (ADR-0017)."
  - "Every emitted property block carries a seed literal derived deterministically from the context (a 32-bit stable hash of the block's clause IDs + grammar version) or the explicit config.propertyBased.seed override, so generation stays a pure function and the emitted test is reproducible run-to-run (ADR-0017)."
  - "A multi-param guard oracle of a documented joint-sampling shape (equality-mirror `p1 == p2` / `p1 === p2`, a bothSideFieldRef equality with a manifest-FIELD operand via the FIELD-BOUND layout, or a numeric sum/difference coupling) always produces a runnable property block — never a per-param .filter over a multi-param predicate, never a hanging property; PROPERTY_UNPLANNABLE is reserved for genuinely unrepresentable shapes (VERSAILLES-165)."
  - "Emitted output either type-checks under the documented baseline strict tsconfig (including allowImportingTsExtensions) or surfaces a non-silent warning — never silently type-broken output; the guarantee is scoped to the documented baseline tsconfig, not arbitrary consumer configs (ADR-0021)."
  - "Every PBT oracle lambda emitted into a property block carries explicit param types from the contract/manifest types — e.g. (sku: string) => ... — never an implicit any (ADR-0021); container op-param typeRefs render recursively (list<X> → X[], optional<X> → X | undefined) and an op-param with no renderable TS form even then (e.g. list<Order>) surfaces EMISSION_UNRENDERABLE with its oracles omitted from the block (VERSAILLES-175)."
  - "Non-public (private/protected) or readonly fields are reached in emitted code via a deliberate, documented `(instance as any).<field>` cast decided from the manifest's per-field access/readonly data; public fields are never cast (ADR-0021)."

operations:
  plan_cases:
    requires:
      - "context is a loaded VersaillesContext with isValid true"
      - "operation and component ASTs are parsed and validated"
    ensures:
      - "Boundary cases exist for every numeric precondition comparison at the boundary, boundary - 1, and boundary + 1"
      - "Equivalence partitions exist for every in clause or enum-typed field: one case per partition member plus one case outside the set"
      - "For each precondition clause there is a violation case whose input satisfies all other clauses but falsifies this one"
      - "For each predicate-call precondition there is at least one violation case synthesized deterministically from the registered predicate's paramTypes and registry example hints, or an explicit non-silent warning when no violation input is derivable"
      - "Valid inputs are predicate-aware: any param appearing in a predicate-call precondition is assigned a value the registered predicate accepts, derived deterministically from registry example hints (falling back to paramTypes-aware defaults) — never a value the predicate rejects"
      - "Postcondition-satisfaction cases derive real assertions from simple field-compare postconditions (field op expr / expr op field), resolving old(field) against captured pre-call state; predicate-call, both-side-fieldRef, and uncomputable clauses contribute no assertion (conservative skip — the case is still emitted and every postcondition ID stays traced), and on a void-returning INSTANCE operation the assertions target instance state, not the result"
      - "Invariant tests construct a valid pre-state, call with valid inputs, and assert every invariant post-call"
      - "For every planned operation with no matching method metadata and no resolvable source method, a non-silent UNPLANNABLE_OPERATION warning is emitted and no unrunnable static call is rendered for it; the guard fires whenever the component's entry carries a methods key — empty or not — missing the planned op (an empty map on a refreshed entry warns for every planned op, VERSAILLES-25 follow-up)"
      - "Expected-rejection cases exist for inputs satisfying postconditions but violating a component invariant (build-spec §9.2)"
    examples:
      - input: "plan_cases(context, component OrderService, operation placeOrder with precondition 'x >= 0')"
        output: "cases at x = 0, x = -1, x = 1 plus a violation case for x < 0 asserting rejection"
      - input: "plan_cases(context, component Account, operation deposit with precondition 'isPositive(amount)')"
        output: "at least one violation case for amount (e.g. 0 or a hint-derived negative) asserting rejection, or an explicit non-silent warning"
      - input: "plan_cases(context, component ZeroMethod with refreshed entry methods: {}, operation stagedOp)"
        output: "UNPLANNABLE_OPERATION warning for stagedOp — the empty methods map is the first-class zero-methods signal — and no call emitted (VERSAILLES-25 follow-up)"
  emit_case:
    requires:
      - "test_case is a planned IR case (input values, expected outcome, assertion list, traceability comment)"
      - "rejection_idiom is read from config.json, defaulting to throws"
    ensures:
      - "For violation and expected-rejection cases, the emitted assertions use the configured rejection idiom — never a hardcoded throws"
      - "The emitted call matches the component's manifest method metadata: instance methods render new <Component>().<operation>(<positional args>), static methods render <Component>.<operation>(<positional args>), params pass positionally in declared order, void-return accept cases carry no return-value assertion, and accept/invariant cases on void-returning INSTANCE operations bind the component INSTANCE — assertions target instance state (instance.<field>), never the void return value; a STATIC void operation with assertions renders the bare call with no instance.<field> assertion, since the static call never touches a constructed instance (VERSAILLES-26, VERSAILLES-26 follow-up)"
      - "Module import specifiers derive from the manifest sourcePath entry when present (project-root-relative, POSIX separators) computed relative to the generated file's directory so they resolve to the real source file; a deterministic default applies when absent — never an empty-string import (VERSAILLES-24)"
      - "The output is rendered exclusively by the emitter plugin selected by config.testFramework (vitest *.test.ts, xUnit *.Tests.cs, pytest test_*.py)"
      - "Emitted code either type-checks under the documented baseline strict tsconfig (including allowImportingTsExtensions) or surfaces a non-silent warning — never silently type-broken output; the guarantee is scoped to that documented baseline tsconfig (ADR-0021)"
      - "Non-public (private/protected) or readonly fields are reached via a deliberate `(instance as any).<field>` cast decided from the manifest's per-field access/readonly data; public fields are emitted as instance.<field> with no cast (ADR-0021)"
    examples:
      - input: "emit_case(preconditionViolationCase, rejection_idiom: 'throws')"
        output: "a vitest test that calls the operation and asserts the rejection idiom"
      - input: "emit_case(satisfactionCase on an instance method placeOrder, manifest metadata { static: false, params: ['x'] })"
        output: "const result = new OrderService().placeOrder(x); — instance construction, positional params, no options-object call"
      - input: "emit_case(acceptCase on a STATIC void operation reset with assertions, manifest metadata { static: true, returnType: 'void' })"
        output: "OrderService.reset(...); — the bare static call with NO expect(instance.<field>) assertion, because the static call never touches a constructed instance (VERSAILLES-26 follow-up)"
      - input: "emit_case(invariant case asserting private field balance, manifest field access: 'private', readonly: false)"
        output: "(instance as any).balance = 50; expect((instance as any).balance)... — the non-public field is reached via a deliberate cast; a public field would emit instance.<field> with no cast (ADR-0021)"
  generate:
    requires:
      - "context.isValid is true"
    ensures:
      - "The generated/ directory is rewritten full-file from contracts.json — tool-owned state, never an input"
      - "Two runs on the same context produce byte-identical output"
      - "generated/coverage.json maps every clause ID to its generated test IDs, leaving zero-coverage clauses detectable"
      - "Emitted files import components via module paths derived from manifest sourcePath entries — resolvable from the generated file's directory to the real source file (deterministic default when absent)"
      - "No test files are written when the context is invalid; the structured errors are surfaced instead"
    examples:
      - input: "generate(contextIsValidTrue)"
        output: "generated/ populated with per-component/operation test files plus coverage.json"
      - input: "generate(contextIsValidFalse)"
        output: "rejected; no test files written; structured errors surfaced"
  plan_property_blocks:
    requires:
      - "context is a loaded VersaillesContext with isValid true"
      - "config.propertyBased.enabled is true — property blocks are never planned when disabled"
    ensures:
      - "Property blocks are planned per case kind (postcondition-satisfaction, invariant-preservation, precondition-violation, expected-rejection), additive to the concrete cases"
      - "Per-param arbitraries derive from manifest/param typeRefs and the planner's numeric constraint bounds; in/enum params map to member constants, strings to bounded strings"
      - "Contract clauses are codegen'd into the generated test as the oracle — inline predicate functions (pure by grammar) with predicate calls resolving to the registered predicate functions"
      - "Oracle lambdas carry explicit param types from the contract/manifest types — e.g. (sku: string) => sku !== \"\", (price: number) => ... — never an implicit any (ADR-0021)"
      - "Every planned block carries a seed literal — a 32-bit int derived from a stable hash of the block's clause IDs + grammar version, or the explicit config.propertyBased.seed override; numRuns comes from config (default 100)"
      - "When enabled, the expected-rejection property replaces the §9.2 bounded sweep (EXPECTED_REJECTION_SWEEP_MAX); the sweep remains the non-PBT fallback when disabled"
      - "A clause that cannot be turned into a filterable arbitrary surfaces a non-silent non-blocking warning (same tier as PREDICATE_UNPLANNABLE — CliResult.warnings, exit 0) — never a silent zero; the skipped clause's coverage gap stays visible in coverage.json"
      - "Rejection properties assert the configured rejection idiom (default throws, ADR-0007)"
      - "Multi-param guard oracles are planned with joint sampling, never a per-param .filter over a multi-param predicate: an equality oracle p1 == p2 / p1 === p2 (bothSideFieldRef, both operands operation params) generates p1 from its arbitrary and mirrors the value to p2 — the emitted callback contains `const p2 = p1;`, no filter, zero filter sparsity; a bothSideFieldRef equality with a manifest-FIELD operand (e.g. `status == newStatus`) renders the FIELD-BOUND layout — op-params only, the component instance bound, the field mapped to `instance.<field>` in the assertion, no mirror/record/filter; a coupled numeric compound over multiple params (e.g. `a >= 0 and b >= 0 and a + b <= 100`) derives per-param bounds including cross-param propagation from sum/difference leaves (`p1 + p2 <= C` with lower bounds L1, L2 → `p1 <= C - L2`, `p2 <= C - L1`; mirrored for `>=`/`>` with upper bounds) and emits `fc.record({ a: ..., b: ... }).filter(({ a, b }) => <oracle>(a, b))` over the bounded joint region — bounded space first so the valid region is healthy (~>=50%), never filter-sparse, never a hang (VERSAILLES-165)"
      - "A multi-param oracle of an unsupported shape — non-mirrorable equality (`!=`/`!==`), equality-of-sums (`a + b == C`), a coupling referencing a manifest-field operand, a coupling whose propagation yields inverted bounds (unsatisfiable region), a zero-param field-field equality (`f1 == f2`), an unboundable coupling, an unrenderable oracle, or a component-typed param — surfaces a non-silent non-blocking PROPERTY_UNPLANNABLE warning (CliResult.warnings, exit 0) — never a silent zero, never a hanging property (VERSAILLES-165)"
    examples:
      - input: "plan_property_blocks(context with propertyBased.enabled true, operation placeOrder with precondition 'x >= 0', numRuns 100)"
        output: "a postcondition-satisfaction property block over integer arbitraries bounded by the numeric constraints, asserting the clause via the codegen'd oracle, pinned by a derived seed literal"
      - input: "plan_property_blocks(context with an unplannable compound precondition clause)"
        output: "a non-silent non-blocking warning in CliResult.warnings (exit 0); no property block for that clause and its coverage gap stays visible in coverage.json"
      - input: "plan_property_blocks(context, operation placeOrder with precondition 'x >= 0 and y >= 0 and x + y <= 100')"
        output: "a runnable property block over fc.record({ x: ..., y: ... }).filter(({ x, y }) => <oracle>) — cross-param bounds x <= 100 - L_y, y <= 100 - L_x derived from the sum leaf before any filter so the valid region stays healthy (~>=50%), never filter-sparse, never a hang (VERSAILLES-165)"
      - input: "plan_property_blocks(context, operation transfer with postcondition 'fromBalance == toBalance' — a bothSideFieldRef equality oracle)"
        output: "a runnable property block sampling fromBalance from its arbitrary and emitting `const toBalance = fromBalance;` in the callback — no .filter, zero filter sparsity; the mirror guarantees the oracle holds (VERSAILLES-165)"
      - input: "plan_property_blocks(context, operation setStatus with postcondition 'status == newStatus' — a bothSideFieldRef equality with a manifest-FIELD operand)"
        output: "a runnable property block in the FIELD-BOUND layout: only the op-param arbitrary (newStatus) is sampled, the component instance is bound, the call passes the sampled params, and the assertion maps the field to instance.status — no mirror const, no record, no filter (VERSAILLES-165)"

must:
  - "Plan boundary cases for every numeric comparison in preconditions: at the boundary, boundary - 1, and boundary + 1 (build-spec §9.1)."
  - "Plan equivalence partitions for every in clause or enum-typed field: one case per partition member plus one case outside the set (build-spec §9.1)."
  - "Plan precondition-violation cases: for each precondition clause individually, an input satisfying all other clauses but falsifying this one; assert rejection (build-spec §9.1)."
  - "Plan at least one violation case for every predicate-call precondition, synthesizing the input deterministically from the registered predicate's paramTypes and registry example hints; when no violation input is derivable, surface an explicit non-silent warning instead of emitting zero cases (build-spec §9.1)."
  - "Synthesize valid inputs predicate-aware: when a param is guarded by a registered predicate, choose a value the predicate accepts, deterministically from registry example hints or paramTypes-aware defaults — never an input the operation's registered predicates would reject (build-spec §9.1)."
  - "Render calls shape-aware from manifest method metadata: instance methods via new <Component>().<operation>(...), static methods via <Component>.<operation>(...), positional params in declared order, no return-value assertions for void-returning operations, and accept/invariant cases on void-returning INSTANCE operations bound to the component INSTANCE — assertions target instance state (instance.<field>), never the void return value — while a STATIC void operation with assertions renders the bare call with no instance.<field> assertion, since the static call never touches a constructed instance (build-spec §9.4, VERSAILLES-26, VERSAILLES-26 follow-up)."
  - "Derive emitter module import paths from project-root-relative manifest sourcePath entries (POSIX separators) computed relative to the generated file's directory — the emitted specifier must resolve to the real source file, not merely share an extension or suffix (build-spec §9.4, VERSAILLES-24)."
  - "Surface a non-silent UNPLANNABLE_OPERATION warning (same non-blocking tier as PREDICATE_UNPLANNABLE — suite-level warning → CliResult.warnings, exit 0) when a planned operation has no matching method metadata and no resolvable source method, and do not emit the legacy static options-object call for it (build-spec §9.1, VERSAILLES-25). The guard fires whenever the component's entry carries a methods key — empty or not — missing the planned op: an empty methods map ({} on a refreshed entry) warns for every planned op; only an entry lacking the methods key entirely (preserved legacy, extractor never touched) keeps the legacy default (VERSAILLES-25 follow-up)."
  - "Plan postcondition-satisfaction cases: valid inputs asserted against the simple field-compare postconditions (field op expr / expr op field), with old(field) resolved against captured pre-call state; predicate-call, both-side-fieldRef, and uncomputable clauses contribute no assertion — conservative skip, the case still traces them (build-spec §9.1)."
  - "Plan per-component invariant tests: valid pre-state satisfying all invariants, call with valid inputs, assert every invariant still holds post-call (build-spec §9.2)."
  - "Plan expected-rejection cases for the postcondition/invariant interaction bug class: inputs satisfying the operation's postconditions but violating a component invariant, flagged so the operation should refuse to complete (build-spec §9.2)."
  - "Apply the rejection idiom configured in config.json (default throws) to both the §9.1 precondition-violation surface and the §9.2 expected-rejection surface (ADR-0007)."
  - "Emit a traceability comment on every generated test with the contract clause ID(s) it covers, marking the case kind (for example, a precondition-violation case) (build-spec §9.3)."
  - "Maintain generated/coverage.json mapping clause IDs to generated test IDs so a clause with zero generated tests is detectable (build-spec §9.3)."
  - "Render all output through the emitter plugin selected by config.testFramework — vitest (*.test.ts), xUnit (*.Tests.cs), or pytest (test_*.py), the full ADR-0009 matrix (ADR-0008, ADR-0009)."
  - "Regenerate the generated/ directory full-file and idempotently from contracts.json; never preserve hand-edited content (build-spec §9.4)."
  - "Block generation and write no test files when context.isValid is false, surfacing the structured errors (build-spec §9)."
  - "Emit PBT blocks only when config.propertyBased.enabled is true — with enabled false (or absent) the emitted suite is byte-identical to the v1 concrete-case output: no property blocks, no new imports (ADR-0017)."
  - "Pin every emitted property block's run with a seed literal — fc.assert(prop, { seed, numRuns }) — derived as a 32-bit int from a stable hash of the context (the block's clause IDs + grammar version) or the explicit config.propertyBased.seed override, so the emitted file stays byte-identical on regeneration and the test is reproducible run-to-run (ADR-0017)."
  - "Plan property blocks per case kind (postcondition-satisfaction, invariant-preservation, precondition-violation, expected-rejection), additive to the concrete cases, with per-param arbitraries derived from typeRefs and numeric constraint bounds and the contract clauses codegen'd into the test as the oracle (ADR-0017)."
  - "When propertyBased is enabled, replace the §9.2 expected-rejection bounded sweep with the expected-rejection property; the sweep remains the non-PBT fallback when disabled (ADR-0017)."
  - "Assert rejection in property blocks with the configured rejection idiom (default throws, ADR-0007)."
  - "Surface a non-silent non-blocking warning (same tier as PREDICATE_UNPLANNABLE — CliResult.warnings, exit 0) for a clause that cannot be turned into a filterable arbitrary — never a silent zero; the clause's coverage gap stays visible in coverage.json (ADR-0017)."
  - "Derive cross-param bounds for coupled numeric compounds BEFORE emitting any filter — sum/difference leaves with known per-param lower bounds propagate upper bounds across params (`p1 + p2 <= C` with L1, L2 → `p1 <= C - L2`, `p2 <= C - L1`; `>=`/`>` mirrors with upper bounds) so the sampled joint region is bounded first and the valid region stays healthy (~>=50%) — this is the filter-sparsity mitigation for multi-param oracles (VERSAILLES-165)."
  - "Mirror equality-oracle params jointly: for a guard `p1 == p2` / `p1 === p2` with both operands operation params, sample p1 from its arbitrary and emit `const p2 = p1;` in the callback — the mirror params are never independently sampled (VERSAILLES-165)."
  - "Render a bothSideFieldRef equality with a manifest-FIELD operand (`f == p`, e.g. `status == newStatus`) via the FIELD-BOUND layout: sample ONLY the op-param arbitraries, bind the component instance, call with the sampled params positionally, and assert the oracle with the field mapped to `instance.<field>` — never a mirror const, never a record, never a filter on the field; a field-referencing multi-param guard in the operation's guard set makes every OTHER satisfies/invariant-preserving descriptor of the operation PROPERTY_UNPLANNABLE (the mirror/record layouts cannot filter with a field-referencing sibling), while a zero-param field-field equality (`f1 == f2`) is PROPERTY_UNPLANNABLE because the FIELD-BOUND layout has no arbitrary to sample (VERSAILLES-165)."
  - "Route every multi-param guard oracle to a joint-sampling strategy (equality-mirror, FIELD-BOUND, or record-based coupled sampling) or, when the shape is unsupported, surface PROPERTY_UNPLANNABLE — a multi-param predicate is never emitted as a per-param .filter (VERSAILLES-165)."
  - "Emit code that type-checks under the documented baseline strict tsconfig (including allowImportingTsExtensions), or surface a non-silent warning (same tier as UNPLANNABLE_OPERATION / PROPERTY_UNPLANNABLE — CliResult.warnings, exit 0) — never silently type-broken output; the guarantee is scoped to the documented baseline tsconfig, not arbitrary consumer configs (ADR-0021)."
  - "Emit every PBT oracle lambda with explicit param types from the contract/manifest types — e.g. (sku: string) => ..., (price: number) => ... — never an implicit any (ADR-0021); render container op-param typeRefs recursively (list<X> → X[], optional<X> → X | undefined) and surface EMISSION_UNRENDERABLE for an op-param with no renderable TS form even then (e.g. list<Order>), omitting its oracles from the block (VERSAILLES-175)."
  - "Reach non-public (private/protected) or readonly fields via a deliberate `(instance as any).<field>` cast decided from the manifest's per-field access/readonly data; never cast public fields (ADR-0021)."

must_not:
  - "Must not run generation against a context where isValid is false — invalid contracts block generation (build-spec §9)."
  - "Must not invoke an LLM at generation time or anywhere in the tool — no LLM client, no prompting logic, no retry loop (ADR-0010, ADR-0002)."
  - "Must not hardcode 'throws' in rejection assertions — rejection assertions must read the configured idiom from config.json and apply it to both the §9.1 violation and §9.2 expected-rejection surfaces (ADR-0007)."
  - "Must not place framework-specific rendering logic in the core — all rendering lives behind the emitter plugin seam (ADR-0008)."
  - "Must not treat hand-edited generated/ content as source or preserve it — the directory is fully tool-owned and full-file regenerated (build-spec §9.4)."
  - "Must not emit a coverage manifest that hides gaps — every clause maps to its generated test IDs, and zero-coverage clauses remain detectable (build-spec §9.3)."
  - "Must not be nondeterministic at generation time — same context in, byte-identical suite out; no randomness in the generation pipeline, no timestamps, no LLM (ADR-0002, re-scoped to generation-time by ADR-0017); run-time randomness in emitted PBT blocks must be seed-pinned (ADR-0017)."
  - "Must not emit zero tests for a predicate-call precondition silently — a genuinely unplannable predicate call surfaces an explicit non-silent warning; silent gaps are forbidden (build-spec §9.1)."
  - "Must not emit a 'valid' input that a registered predicate in the operation's preconditions would reject — predicate-aware synthesis must satisfy registered predicates (build-spec §9.1)."
  - "Must not render calls that mismatch the extracted method metadata — a static call on an instance method, an options-object argument list where positional params are declared, a return-value assertion on a void operation, or an instance.<field> assertion on a STATIC void operation (the static call never touches a constructed instance) (build-spec §9.4, VERSAILLES-26 follow-up)."
  - "Must not emit the legacy static options-object call (<Component>.<op>({ ...inputs })) for a planned operation that has no matching method metadata and no resolvable source method — that is dead, unrunnable code; it must surface a non-silent UNPLANNABLE_OPERATION warning instead. The guard fires whenever the component's entry carries a methods key — empty or not — missing the planned op; only preserved legacy entries lacking the methods key entirely may keep the legacy default (build-spec §9.1, VERSAILLES-25, VERSAILLES-25 follow-up)."
  - "Must not bind a result for a void-returning operation's accept/invariant case and assert result.<field> — assertions target the component instance (const instance = new <Component>(); instance.<field> = <captured>; instance.<op>(...); expect(instance.<field>)...), never the void return value; and must not assert instance.<field> on a STATIC void operation's accept case — the static call never touches a constructed instance, so the case renders the bare call without assertions (build-spec §9.4, VERSAILLES-26, VERSAILLES-26 follow-up)."
  - "Must not emit an import specifier that fails to resolve to the real source file from the generated file's directory — resolvability is required, not merely a matching extension or suffix (build-spec §9.4, VERSAILLES-24)."
  - "Must not emit PBT blocks when config.propertyBased.enabled is false — the v1 default output stays byte-identical (no property blocks, no new imports) (ADR-0017)."
  - "Must not emit a property block whose run is unpinned — every PBT block carries a seed literal derived from the context (or the explicit config override) so the emitted test is reproducible run-to-run and regeneration stays byte-identical (ADR-0017)."
  - "Must not skip an unplannable PBT clause silently — a clause that cannot become a filterable arbitrary surfaces a non-silent non-blocking warning (same tier as PREDICATE_UNPLANNABLE, exit 0) and its coverage gap stays visible in coverage.json (ADR-0017)."
  - "Must not emit a per-param .filter for a multi-param oracle — fast-check's .filter() over independently sampled per-param arbitraries receives undefined for the 2nd+ params, filters every candidate, and the property hangs; multi-param oracles must use a joint-sampling strategy (equality-mirror, FIELD-BOUND, record-based coupled sampling) or surface PROPERTY_UNPLANNABLE (VERSAILLES-165)."
  - "Must not independently sample the two params of an equality-mirror oracle (`p1 == p2`) — independent sampling would make the oracle vanish under filter sparsity; the mirror emits `const p2 = p1;` (VERSAILLES-165)."
  - "Must not emit a filter for a coupled compound whose bounds were not derived — filtering an unbounded joint region is a hang; cross-param bounds must be derived before any filter or the clause surfaces PROPERTY_UNPLANNABLE (VERSAILLES-165)."
  - "Must not silently emit type-broken output — emitted code either type-checks under the documented baseline strict tsconfig (including allowImportingTsExtensions) or surfaces a non-silent warning (ADR-0021)."
  - "Must not emit an implicit-any oracle lambda — PBT oracle lambdas always carry explicit param types from the contract/manifest types (ADR-0021)."
  - "Must not cast a public field (instance.<field> with no cast), and must not reach a non-public (private/protected) or readonly field without the deliberate `(instance as any).<field>` cast decided from the manifest's access/readonly data (ADR-0021)."

can:
  - "May support additional config-validated rejection idiom values (for example error-return or Result-style) beyond the default throws, as long as emitters consume the configured value."
  - "May add non-required heuristic cases beyond the mandated case classes when they aid coverage, provided determinism holds."
  - "May consult registry example hints for satisfying/violating predicate argument values, keeping synthesis deterministic (build-spec §9.5 keeps SMT out of v1 scope)."
  - "May record case-planning metadata (test names, covered clause IDs) in coverage.json beyond the minimal mapping."
  - "May skip emitting an unrenderable operation's cases (VERSAILLES-25) while still mapping its clause IDs in coverage.json so the coverage gap remains detectable."
  - "May accept an explicit config.propertyBased.seed override to pin exploration across contract edits (ADR-0017)."
  - "May emit property blocks additively alongside the concrete cases — the concrete cases remain the audit spine for coverage.json traceability (ADR-0017)."
  - "May apply the record-based coupled sampling strategy to any conjunction of numeric comparisons and sum/difference couplings whose per-param bounds are derivable — not just the canonical `a + b <= C` shape — as long as the derived joint region stays bounded (VERSAILLES-165)."

limits:
  - "No SMT-backed precise input synthesis or witness generation (v2 stretch, build-spec §9.5) — predicate planning uses deterministic heuristics over registry paramTypes + example hints only."
  - "No running or executing of generated tests — generation writes files only."
  - "No emitter beyond the ADR-0009 matrix — the seam dispatches the complete set (vitest *.test.ts, xUnit *.Tests.cs, pytest test_*.py); additional frameworks are future work."
  - "No semantic validation of contracts (contract-language) and no manifest derivation (manifest-extraction) — both are consumed via the context only."
  - "No hand-editing of generated/ as a supported workflow (build-spec §9.4) and no LLM involvement of any kind inside the tool (ADR-0010)."
  - "No SMT-backed witness synthesis — seeded PBT emission is stochastic exploration, never a soundness mechanism; SMT remains out of scope for the core (ADR-0014, ADR-0017)."
  - "No execution of generated tests, including property blocks — generation writes files only."
  - "PBT emission requires the consuming project to add the PBT library (fast-check first behind the vitest emitter) as a dev dependency — the tool ships the codegen, not the library (ADR-0017)."
  - "The type-soundness guarantee is scoped to the documented baseline strict tsconfig that ships with the example (including allowImportingTsExtensions); the tool cannot guarantee type-correctness under arbitrary consumer tsconfigs — shapes the emitter cannot render type-safely under that baseline surface a non-silent warning (ADR-0021)."
  - "Joint sampling supports only the documented shapes: equality-mirror (`p1 == p2` / `p1 === p2`, bothSideFieldRef with both operands operation params), the FIELD-BOUND layout (a bothSideFieldRef equality with a manifest-FIELD operand), and numeric sum/difference couplings over multiple params — no general constraint solving, no SMT, no arbitrary multi-param oracles (VERSAILLES-165)."
  - "Equality-of-sums (`a + b == C`), non-mirrorable equality (`!=` / `!==`), field-operand couplings (a coupling referencing a manifest-field operand), couplings whose propagation yields inverted bounds (unsatisfiable region), zero-param field-field equalities (`f1 == f2`), and unboundable couplings (no derivable cross-param bounds) remain PROPERTY_UNPLANNABLE — they are not joint-sampled (VERSAILLES-165)."

asserts:
  - "assert: two generate runs on the same context produce byte-identical output under generated/."
  - "assert: generate against a context with isValid false writes zero test files and surfaces structured errors."
  - "assert: every clause ID present in contracts.json is mapped in coverage.json to at least one test ID or is explicitly listed as zero-coverage."
  - "assert: a predicate-call precondition (e.g. isPositive(amount)) yields at least one planned violation case, or an explicit warning appears in the generation output — never a silent zero."
  - "assert: valid inputs for an operation with a registered predicate guard satisfy the predicate (e.g. isPositive(amount) never receives 0) when the registry provides the means."
  - "assert: emitted calls match the manifest method metadata — instance methods are constructed before calling, positional params pass in declared order, static methods are called on the component, and void-return accept cases carry no return-value assertion."
  - "assert: emitted module import paths derive from manifest sourcePath (or a deterministic default), never an empty string."
  - "assert: an emitted module import specifier derived from a manifest sourcePath resolves to the real source file from the generated file's directory for a nested layout (e.g. sourcePath 'src/order.ts' → the import resolves to <root>/src/order.ts) (VERSAILLES-24)."
  - "assert: a planned operation with no matching method metadata and no resolvable source method (e.g. Order.setSubtotal with no such method in the manifest) yields a non-silent UNPLANNABLE_OPERATION warning in CliResult.warnings (exit 0) and its generated file contains no static options-object call for that operation (VERSAILLES-25)."
  - "assert: a component whose refreshed entry carries methods: {} (the zero-methods signal) still yields UNPLANNABLE_OPERATION warnings for every planned operation — an empty map is not treated as a legacy entry (VERSAILLES-25 follow-up)."
  - "assert: a void-returning INSTANCE operation's accept/invariant case (e.g. new Order().addItem('initial') asserting subtotal) renders const instance = new Order(); instance.addItem('initial'); expect(instance.subtotal)... — never const result = ...; expect(result.subtotal)... (VERSAILLES-26)."
  - "assert: a STATIC void operation's accept case with assertions (e.g. OrderService.reset() asserting a field) renders the bare static call with NO expect(instance.<field>) assertion — the static call never touches a constructed instance, so no misleading instance binding appears (VERSAILLES-26 follow-up)."
  - "assert: rejection assertions in generated tests use the configured rejection idiom from config.json (default throws), for both violation and expected-rejection cases."
  - "assert: every generated test file contains a traceability comment referencing at least one contract clause ID."
  - "assert: two generate runs with config.propertyBased.enabled true produce byte-identical output under generated/, including the emitted seed literals."
  - "assert: distinct property blocks in a suite carry distinct seed literals (derived per-block from the covered clause IDs + grammar version, or the explicit config override)."
  - "assert: with config.propertyBased.enabled false (or absent), the emitted suite is byte-identical to the v1 concrete-case output — no property blocks, no new imports (backward-compat pin)."
  - "assert: a clause that cannot be turned into a filterable arbitrary yields a non-silent non-blocking warning in CliResult.warnings (exit 0) — never a silent zero — and its coverage gap stays visible in coverage.json."
  - "assert: an equality oracle's property block (e.g. a postcondition `fromBalance == toBalance` — both operands operation params) samples both params via the mirror — the emitted callback contains `const p2 = p1;` — and the block runs with no .filter and no filter sparsity (VERSAILLES-165)."
  - "assert: a field-source equality's property block (e.g. a postcondition `status == newStatus` where status is a manifest field) renders the FIELD-BOUND layout — only the op-param arbitrary is sampled, the component instance is bound, and the assertion maps the field to instance.status; no mirror const, no record, no filter, no PROPERTY_UNPLANNABLE warning (VERSAILLES-165)."
  - "assert: a coupled compound's property block (e.g. `a >= 0 and b >= 0 and a + b <= 100`) derives cross-param bounds (`a <= 100 - L_b`, `b <= 100 - L_a`) before emitting `fc.record({...}).filter(({ a, b }) => <oracle>)` — the run terminates with no 'too many pre-conditions' failure, no hang, healthy valid region (VERSAILLES-165)."
  - "assert: an unrepresentable multi-param shape (equality-of-sums, non-mirrorable equality, field-operand coupling, inverted derived bounds, zero-param field-field equality, unboundable coupling, component-typed param, unrenderable oracle) still yields a non-silent PROPERTY_UNPLANNABLE warning in CliResult.warnings (exit 0) and its coverage gap stays visible in coverage.json (VERSAILLES-165)."
  - "assert: the generated example type-checks under the documented baseline strict tsconfig (tsc --noEmit including allowImportingTsExtensions) and passes vitest run; any shape the emitter cannot render type-safely under that baseline surfaces a non-silent warning instead of silently type-broken output (ADR-0021)."
  - "assert: PBT oracle lambdas carry explicit param types from the contract/manifest types — e.g. (sku: string) => sku !== \"\", (price: number) => ... — with no implicit-any sites (ADR-0021); container op-param typeRefs render recursively (list<string> → string[], optional<number> → number | undefined) and an op-param with no renderable TS form even then (e.g. list<Order>) yields a non-silent EMISSION_UNRENDERABLE warning with its oracles omitted from the block (VERSAILLES-175)."
  - "assert: a private or readonly field (e.g. `private balance: number`) is reached in emitted code via (instance as any).balance — never instance.balance uncast — while a public field emits instance.<field> with no cast (ADR-0021)."

