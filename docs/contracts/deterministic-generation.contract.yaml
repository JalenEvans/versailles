# Contract: deterministic-generation
# Owner: general-manager
# Gate: contract_gate — no implementation starts without a registered contract
# Validated by: scripts/validate-contracts.sh
# Canonical source: ~/.opencode/skills/contract-builder/references/contract.template.yaml

schema_version: 1
context: deterministic-generation

owns:
  - "The framework-agnostic test-case IR and case planning (build-spec §9.1–§9.2): boundary values, equivalence partitions, precondition-violation, postcondition-satisfaction, per-component invariant tests, expected-rejection cases"
  - "The rejection idiom application from config.json (default throws) on both the §9.1 violation surface and the §9.2 expected-rejection surface (ADR-0007)"
  - "Traceability: per-test traceability comments and generated/coverage.json clause-to-test mapping (build-spec §9.3)"
  - "The emitter plugin seam selected by config.testFramework — vitest (*.test.ts), xUnit (*.Tests.cs), pytest (test_*.py), the full ADR-0009 matrix (ADR-0008, ADR-0009)"
  - "Full-file idempotent regeneration of the tool-owned generated/ directory (build-spec §9.4)"
  - "Predicate-aware planning: predicate-call preconditions produce at least one violation case via deterministic synthesis (registered predicate paramTypes + registry example hints), or an explicit non-silent warning when genuinely unplannable (build-spec §9.1)"
  - "Predicate-aware valid-input synthesis: valid params satisfy registered predicates deterministically, never silently generating inputs the operation would reject (build-spec §9.1)"
  - "Emitter call-shape awareness: shape-aware invocation (instance → new <Component>().<op>(...), static → <Component>.<op>(...), void-return acceptance without return assertions, and accept/invariant assertions on void-returning operations bound to the component INSTANCE — never the void return value) driven by manifest method metadata (build-spec §9.4, VERSAILLES-26); a STATIC void operation with assertions renders the bare call without the instance.<field> assertion, since the static call never touches a constructed instance (VERSAILLES-26 follow-up)"
  - "Resolvable emitter module paths: import specifiers derived from the project-root-relative manifest sourcePath (POSIX separators) computed relative to the generated file's directory, so the emitted import resolves to the real source file; deterministic fallback when sourcePath is absent (build-spec §9.4, VERSAILLES-24)"
  - "Non-silent planning warnings for unrenderable operations: a planned operation with no matching method metadata and no resolvable source method surfaces a non-blocking UNPLANNABLE_OPERATION warning (same tier as PREDICATE_UNPLANNABLE — CliResult.warnings, exit 0) and is never emitted as an unrunnable static call (build-spec §9.1, VERSAILLES-25); the guard fires whenever the component's entry carries a methods key — empty or not — missing the planned op, and only an entry lacking the methods key entirely (a preserved legacy entry the extractor never touched) keeps the legacy default (VERSAILLES-25 follow-up)"

purpose: |
  deterministic-generation is the core value proposition of Versailles: a pure, deterministic
  compiler from approved contracts to test files. Given the same validated context it produces a
  byte-identical test suite every run — no randomness, no timestamps, no LLM (ADR-0002,
  ADR-0010). It plans a framework-agnostic test-case IR covering boundary values, equivalence
  partitions, precondition-violation cases, postcondition-satisfaction cases, per-component
  invariant tests, and expected-rejection cases for the postcondition/invariant interaction bug
  class. Predicate-call preconditions (e.g. isPositive(amount)) are planned too: at least one
  deterministic violation case per predicate call, or an explicit non-silent warning — never a
  silent zero — and valid-input synthesis is predicate-aware so a registered predicate guard
  never receives a value it rejects. Emitters render shape-aware calls from manifest method
  metadata (instance vs static vs void-return) and import components via sourcePath-derived
  module paths. Rejection assertions on both the violation and expected-rejection surfaces use the
  rejection idiom configured in config.json (default throws, ADR-0007). Every generated test
  carries a traceability comment and generated/coverage.json maps clause IDs to test IDs so
  zero-coverage clauses are detectable. Output is rendered by per-framework emitter plugins (vitest, xUnit, pytest) into the fully tool-owned generated/ directory via idempotent, full-file
  regeneration.

invariants:
  - "Generation runs only against a context where isValid is true; invalid contexts never produce test files."
  - "The generator is a pure function of the context: same context in, byte-identical output out — no randomness, no timestamps, no LLM (ADR-0002)."
  - "Every generated test carries a traceability comment; generated/coverage.json maps every contract clause ID to its generated test IDs, leaving zero-coverage clauses detectable."
  - "The tool never invokes an LLM at generation time or anywhere in the tool (ADR-0010)."
  - "No framework-specific rendering logic lives in the core — all rendering is behind the emitter plugin seam (ADR-0008)."
  - "Every predicate-call precondition yields at least one planned violation case or an explicit, non-silent warning — never a silent zero-case outcome (build-spec §9.1)."
  - "Valid-input synthesis is predicate-aware: a param guarded by a registered predicate always receives a value the predicate accepts when the registry provides the means (paramTypes + example hints); the planner never emits an input the operation is known to reject as a 'valid' input."
  - "Emitted calls match the manifest method metadata: instance methods are invoked on a constructed instance, static methods on the component, params passed positionally in declared order, and void-return accept cases carry no return-value assertion (build-spec §9.4)."
  - "Accept/invariant cases on void-returning INSTANCE operations assert component instance state — const instance = new <Component>(); instance.<op>(...); expect(instance.<field>)... — never the void return value (build-spec §9.4, VERSAILLES-26). A STATIC void operation with assertions renders the bare call with no instance.<field> assertion — the static call never touches a constructed instance, so asserting on one would be misleading (VERSAILLES-26 follow-up)."
  - "A planned operation with no matching method metadata and no resolvable source method surfaces a non-silent UNPLANNABLE_OPERATION warning in the suite warnings (same non-blocking tier as PREDICATE_UNPLANNABLE — CliResult.warnings, exit 0) and never emits an unrunnable static options-object call for it (build-spec §9.1, VERSAILLES-25). The guard fires whenever the component's entry carries a methods key — empty or not — missing the planned op: an empty methods map ({} on a refreshed entry) still triggers the warning for every planned op, because it is the first-class 'we know this component has zero methods' signal; only an entry lacking the methods key entirely (preserved legacy, extractor never touched) keeps the legacy default (VERSAILLES-25 follow-up)."
  - "Emitted module import specifiers derived from a manifest sourcePath resolve to the real source file from the generated file's directory — resolvability is required, not merely a matching extension or suffix (build-spec §9.4, VERSAILLES-24)."

operations:
  plan_cases:
    requires:
      - "context is a loaded VersaillesContext with isValid true"
      - "operation and component ASTs are parsed and validated"
    ensures:
      - "Boundary cases exist for every numeric precondition comparison at the boundary, boundary - 1, and boundary + 1"
      - "Equivalence partitions exist for every in clause or enum-typed field: one case per partition member plus one case outside the set"
      - "For each precondition clause there is a violation case whose input satisfies all other clauses but falsifies this one"
      - "For each predicate-call precondition there is at least one violation case synthesized deterministically from the registered predicate's paramTypes and registry example hints, or an explicit non-silent warning when no violation input is derivable"
      - "Valid inputs are predicate-aware: any param appearing in a predicate-call precondition is assigned a value the registered predicate accepts, derived deterministically from registry example hints (falling back to paramTypes-aware defaults) — never a value the predicate rejects"
      - "Postcondition-satisfaction cases assert every postcondition, resolving old(field) against captured pre-call state"
      - "Invariant tests construct a valid pre-state, call with valid inputs, and assert every invariant post-call"
      - "For every planned operation with no matching method metadata and no resolvable source method, a non-silent UNPLANNABLE_OPERATION warning is emitted and no unrunnable static call is rendered for it; the guard fires whenever the component's entry carries a methods key — empty or not — missing the planned op (an empty map on a refreshed entry warns for every planned op, VERSAILLES-25 follow-up)"
      - "Expected-rejection cases exist for inputs satisfying postconditions but violating a component invariant (build-spec §9.2)"
    examples:
      - input: "plan_cases(context, component OrderService, operation placeOrder with precondition 'x >= 0')"
        output: "cases at x = 0, x = -1, x = 1 plus a violation case for x < 0 asserting rejection"
      - input: "plan_cases(context, component Account, operation deposit with precondition 'isPositive(amount)')"
        output: "at least one violation case for amount (e.g. 0 or a hint-derived negative) asserting rejection, or an explicit non-silent warning"
      - input: "plan_cases(context, component ZeroMethod with refreshed entry methods: {}, operation stagedOp)"
        output: "UNPLANNABLE_OPERATION warning for stagedOp — the empty methods map is the first-class zero-methods signal — and no call emitted (VERSAILLES-25 follow-up)"
  emit_case:
    requires:
      - "test_case is a planned IR case (input values, expected outcome, assertion list, traceability comment)"
      - "rejection_idiom is read from config.json, defaulting to throws"
    ensures:
      - "For violation and expected-rejection cases, the emitted assertions use the configured rejection idiom — never a hardcoded throws"
      - "The emitted call matches the component's manifest method metadata: instance methods render new <Component>().<operation>(<positional args>), static methods render <Component>.<operation>(<positional args>), params pass positionally in declared order, void-return accept cases carry no return-value assertion, and accept/invariant cases on void-returning INSTANCE operations bind the component INSTANCE — assertions target instance state (instance.<field>), never the void return value; a STATIC void operation with assertions renders the bare call with no instance.<field> assertion, since the static call never touches a constructed instance (VERSAILLES-26, VERSAILLES-26 follow-up)"
      - "Module import specifiers derive from the manifest sourcePath entry when present (project-root-relative, POSIX separators) computed relative to the generated file's directory so they resolve to the real source file; a deterministic default applies when absent — never an empty-string import (VERSAILLES-24)"
      - "The output is rendered exclusively by the emitter plugin selected by config.testFramework (vitest *.test.ts, xUnit *.Tests.cs, pytest test_*.py)"
    examples:
      - input: "emit_case(preconditionViolationCase, rejection_idiom: 'throws')"
        output: "a vitest test that calls the operation and asserts the rejection idiom"
      - input: "emit_case(satisfactionCase on an instance method placeOrder, manifest metadata { static: false, params: ['x'] })"
        output: "const result = new OrderService().placeOrder(x); — instance construction, positional params, no options-object call"
      - input: "emit_case(acceptCase on a STATIC void operation reset with assertions, manifest metadata { static: true, returnType: 'void' })"
        output: "OrderService.reset(...); — the bare static call with NO expect(instance.<field>) assertion, because the static call never touches a constructed instance (VERSAILLES-26 follow-up)"
  generate:
    requires:
      - "context.isValid is true"
    ensures:
      - "The generated/ directory is rewritten full-file from contracts.json — tool-owned state, never an input"
      - "Two runs on the same context produce byte-identical output"
      - "generated/coverage.json maps every clause ID to its generated test IDs, leaving zero-coverage clauses detectable"
      - "Emitted files import components via module paths derived from manifest sourcePath entries — resolvable from the generated file's directory to the real source file (deterministic default when absent)"
      - "No test files are written when the context is invalid; the structured errors are surfaced instead"
    examples:
      - input: "generate(contextIsValidTrue)"
        output: "generated/ populated with per-component/operation test files plus coverage.json"
      - input: "generate(contextIsValidFalse)"
        output: "rejected; no test files written; structured errors surfaced"

must:
  - "Plan boundary cases for every numeric comparison in preconditions: at the boundary, boundary - 1, and boundary + 1 (build-spec §9.1)."
  - "Plan equivalence partitions for every in clause or enum-typed field: one case per partition member plus one case outside the set (build-spec §9.1)."
  - "Plan precondition-violation cases: for each precondition clause individually, an input satisfying all other clauses but falsifying this one; assert rejection (build-spec §9.1)."
  - "Plan at least one violation case for every predicate-call precondition, synthesizing the input deterministically from the registered predicate's paramTypes and registry example hints; when no violation input is derivable, surface an explicit non-silent warning instead of emitting zero cases (build-spec §9.1)."
  - "Synthesize valid inputs predicate-aware: when a param is guarded by a registered predicate, choose a value the predicate accepts, deterministically from registry example hints or paramTypes-aware defaults — never an input the operation's registered predicates would reject (build-spec §9.1)."
  - "Render calls shape-aware from manifest method metadata: instance methods via new <Component>().<operation>(...), static methods via <Component>.<operation>(...), positional params in declared order, no return-value assertions for void-returning operations, and accept/invariant cases on void-returning INSTANCE operations bound to the component INSTANCE — assertions target instance state (instance.<field>), never the void return value — while a STATIC void operation with assertions renders the bare call with no instance.<field> assertion, since the static call never touches a constructed instance (build-spec §9.4, VERSAILLES-26, VERSAILLES-26 follow-up)."
  - "Derive emitter module import paths from project-root-relative manifest sourcePath entries (POSIX separators) computed relative to the generated file's directory — the emitted specifier must resolve to the real source file, not merely share an extension or suffix (build-spec §9.4, VERSAILLES-24)."
  - "Surface a non-silent UNPLANNABLE_OPERATION warning (same non-blocking tier as PREDICATE_UNPLANNABLE — suite-level warning → CliResult.warnings, exit 0) when a planned operation has no matching method metadata and no resolvable source method, and do not emit the legacy static options-object call for it (build-spec §9.1, VERSAILLES-25). The guard fires whenever the component's entry carries a methods key — empty or not — missing the planned op: an empty methods map ({} on a refreshed entry) warns for every planned op; only an entry lacking the methods key entirely (preserved legacy, extractor never touched) keeps the legacy default (VERSAILLES-25 follow-up)."
  - "Plan postcondition-satisfaction cases: valid inputs asserted against every postcondition, with old(field) resolved against captured pre-call state (build-spec §9.1)."
  - "Plan per-component invariant tests: valid pre-state satisfying all invariants, call with valid inputs, assert every invariant still holds post-call (build-spec §9.2)."
  - "Plan expected-rejection cases for the postcondition/invariant interaction bug class: inputs satisfying the operation's postconditions but violating a component invariant, flagged so the operation should refuse to complete (build-spec §9.2)."
  - "Apply the rejection idiom configured in config.json (default throws) to both the §9.1 precondition-violation surface and the §9.2 expected-rejection surface (ADR-0007)."
  - "Emit a traceability comment on every generated test with the contract clause ID(s) it covers, marking the case kind (for example, a precondition-violation case) (build-spec §9.3)."
  - "Maintain generated/coverage.json mapping clause IDs to generated test IDs so a clause with zero generated tests is detectable (build-spec §9.3)."
  - "Render all output through the emitter plugin selected by config.testFramework — vitest (*.test.ts), xUnit (*.Tests.cs), or pytest (test_*.py), the full ADR-0009 matrix (ADR-0008, ADR-0009)."
  - "Regenerate the generated/ directory full-file and idempotently from contracts.json; never preserve hand-edited content (build-spec §9.4)."
  - "Block generation and write no test files when context.isValid is false, surfacing the structured errors (build-spec §9)."

must_not:
  - "Must not run generation against a context where isValid is false — invalid contracts block generation (build-spec §9)."
  - "Must not invoke an LLM at generation time or anywhere in the tool — no LLM client, no prompting logic, no retry loop (ADR-0010, ADR-0002)."
  - "Must not hardcode 'throws' in rejection assertions — rejection assertions must read the configured idiom from config.json and apply it to both the §9.1 violation and §9.2 expected-rejection surfaces (ADR-0007)."
  - "Must not place framework-specific rendering logic in the core — all rendering lives behind the emitter plugin seam (ADR-0008)."
  - "Must not treat hand-edited generated/ content as source or preserve it — the directory is fully tool-owned and full-file regenerated (build-spec §9.4)."
  - "Must not emit a coverage manifest that hides gaps — every clause maps to its generated test IDs, and zero-coverage clauses remain detectable (build-spec §9.3)."
  - "Must not be nondeterministic — same context in, byte-identical suite out; no randomness, no timestamps, no LLM (ADR-0002)."
  - "Must not emit zero tests for a predicate-call precondition silently — a genuinely unplannable predicate call surfaces an explicit non-silent warning; silent gaps are forbidden (build-spec §9.1)."
  - "Must not emit a 'valid' input that a registered predicate in the operation's preconditions would reject — predicate-aware synthesis must satisfy registered predicates (build-spec §9.1)."
  - "Must not render calls that mismatch the extracted method metadata — a static call on an instance method, an options-object argument list where positional params are declared, a return-value assertion on a void operation, or an instance.<field> assertion on a STATIC void operation (the static call never touches a constructed instance) (build-spec §9.4, VERSAILLES-26 follow-up)."
  - "Must not emit the legacy static options-object call (<Component>.<op>({ ...inputs })) for a planned operation that has no matching method metadata and no resolvable source method — that is dead, unrunnable code; it must surface a non-silent UNPLANNABLE_OPERATION warning instead. The guard fires whenever the component's entry carries a methods key — empty or not — missing the planned op; only preserved legacy entries lacking the methods key entirely may keep the legacy default (build-spec §9.1, VERSAILLES-25, VERSAILLES-25 follow-up)."
  - "Must not bind a result for a void-returning operation's accept/invariant case and assert result.<field> — assertions target the component instance (const instance = new <Component>(); instance.<op>(...); expect(instance.<field>)...), never the void return value; and must not assert instance.<field> on a STATIC void operation's accept case — the static call never touches a constructed instance, so the case renders the bare call without assertions (build-spec §9.4, VERSAILLES-26, VERSAILLES-26 follow-up)."
  - "Must not emit an import specifier that fails to resolve to the real source file from the generated file's directory — resolvability is required, not merely a matching extension or suffix (build-spec §9.4, VERSAILLES-24)."

can:
  - "May support additional config-validated rejection idiom values (for example error-return or Result-style) beyond the default throws, as long as emitters consume the configured value."
  - "May add non-required heuristic cases beyond the mandated case classes when they aid coverage, provided determinism holds."
  - "May consult registry example hints for satisfying/violating predicate argument values, keeping synthesis deterministic (build-spec §9.5 keeps SMT out of v1 scope)."
  - "May record case-planning metadata (test names, covered clause IDs) in coverage.json beyond the minimal mapping."
  - "May skip emitting an unrenderable operation's cases (VERSAILLES-25) while still mapping its clause IDs in coverage.json so the coverage gap remains detectable."

limits:
  - "No SMT-backed precise input synthesis or witness generation (v2 stretch, build-spec §9.5) — predicate planning uses deterministic heuristics over registry paramTypes + example hints only."
  - "No running or executing of generated tests — generation writes files only."
  - "No emitter beyond the ADR-0009 matrix — the seam dispatches the complete set (vitest *.test.ts, xUnit *.Tests.cs, pytest test_*.py); additional frameworks are future work."
  - "No semantic validation of contracts (contract-language) and no manifest derivation (manifest-extraction) — both are consumed via the context only."
  - "No hand-editing of generated/ as a supported workflow (build-spec §9.4) and no LLM involvement of any kind inside the tool (ADR-0010)."

asserts:
  - "assert: two generate runs on the same context produce byte-identical output under generated/."
  - "assert: generate against a context with isValid false writes zero test files and surfaces structured errors."
  - "assert: every clause ID present in contracts.json is mapped in coverage.json to at least one test ID or is explicitly listed as zero-coverage."
  - "assert: a predicate-call precondition (e.g. isPositive(amount)) yields at least one planned violation case, or an explicit warning appears in the generation output — never a silent zero."
  - "assert: valid inputs for an operation with a registered predicate guard satisfy the predicate (e.g. isPositive(amount) never receives 0) when the registry provides the means."
  - "assert: emitted calls match the manifest method metadata — instance methods are constructed before calling, positional params pass in declared order, static methods are called on the component, and void-return accept cases carry no return-value assertion."
  - "assert: emitted module import paths derive from manifest sourcePath (or a deterministic default), never an empty string."
  - "assert: an emitted module import specifier derived from a manifest sourcePath resolves to the real source file from the generated file's directory for a nested layout (e.g. sourcePath 'src/order.ts' → the import resolves to <root>/src/order.ts) (VERSAILLES-24)."
  - "assert: a planned operation with no matching method metadata and no resolvable source method (e.g. staged Order.setSubtotal with no such method in the manifest) yields a non-silent UNPLANNABLE_OPERATION warning in CliResult.warnings (exit 0) and its generated file contains no static options-object call for that operation (VERSAILLES-25)."
  - "assert: a component whose refreshed entry carries methods: {} (the zero-methods signal) still yields UNPLANNABLE_OPERATION warnings for every planned operation — an empty map is not treated as a legacy entry (VERSAILLES-25 follow-up)."
  - "assert: a void-returning INSTANCE operation's accept/invariant case (e.g. new Order().addItem('initial') asserting subtotal) renders const instance = new Order(); instance.addItem('initial'); expect(instance.subtotal)... — never const result = ...; expect(result.subtotal)... (VERSAILLES-26)."
  - "assert: a STATIC void operation's accept case with assertions (e.g. OrderService.reset() asserting a field) renders the bare static call with NO expect(instance.<field>) assertion — the static call never touches a constructed instance, so no misleading instance binding appears (VERSAILLES-26 follow-up)."
  - "assert: rejection assertions in generated tests use the configured rejection idiom from config.json (default throws), for both violation and expected-rejection cases."
  - "assert: every generated test file contains a traceability comment referencing at least one contract clause ID."

