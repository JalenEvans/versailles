# Contract: predicate-registry
# Owner: general-manager
# Gate: contract_gate — no implementation starts without a registered contract
# Validated by: scripts/validate-contracts.sh
# Canonical source: ~/.opencode/skills/contract-builder/references/contract.template.yaml

schema_version: 1
context: predicate-registry

owns:
  - "The top-level predicates map in contracts.json (build-spec §3.4, ADR-0013): each entry { source, params, paramTypes, returnType, verifiedPure }"
  - "Validator-time predicate declaration verification (ADR-0013): predicate name validity (IDENT grammar), sourceRef resolution under config.sourceRoots (resolve-or-warn → PREDICATE_SOURCE_UNRESOLVED warning)"
  - "The verifiedPure gate (ADR-0006, build-spec §14 default): verifiedPure is a human-set boolean; the validator hard-errors on any contract reference to a predicate with verifiedPure missing or false"
  - "sourceRef recording: every entry's source field traces to a real function; validate resolves it on every run (ADR-0005 'nothing invented' via validate-time resolution)"

purpose: |
  predicate-registry owns the declarative predicate declarations in contracts.json — the named,
  verified-pure functions contract expressions are allowed to call (build-spec §3.4, ADR-0013).
  Predicates are declared inline in a top-level predicates map; validate mechanically verifies
  every declaration (name validity, sourceRef resolution as resolve-or-warn). The registration
  CLI (register-predicate / verify-purity / remind-unverified) and the stored sourceHash are
  removed (ADR-0013). The verifiedPure gate is preserved (ADR-0006): a human sets it as data,
  and the validator hard-errors on any contract reference to an unverified predicate. The
  registry is data for the rest of the pipeline — the joint loader (workspace-context) reads
  it and the semantic validator (contract-language) enforces that referenced predicates exist
  and are verified — and the tool never invokes an LLM (ADR-0010).

invariants:
  - "Every entry in the top-level predicates map of contracts.json conforms to the build-spec §3.4 schema: predicate name → { source: string, params: string[], paramTypes: typeRef[], returnType: 'boolean', verifiedPure: boolean }."
  - "verifiedPure is true only when a human asserted purity through manual lint/review; no automated purity or termination analysis ever sets it (ADR-0006, build-spec §14 default)."
  - "Every predicate declaration's source field traces to a real function: validate resolves sourceRef under config.sourceRoots on every run (ADR-0005 discipline applied to predicates). An unresolvable sourceRef produces a PREDICATE_SOURCE_UNRESOLVED warning, not a hard error."
  - "Predicate declarations are authored inline in contracts.json — no separate predicates.json file, no registration CLI (ADR-0013)."
  - "The predicates map is always consumed as part of the joint workspace load; this context never re-implements loading (workspace-context owns it) and never re-implements predicate-call validation (contract-language owns it)."
  - "The tool never invokes an LLM anywhere in predicate-registry tooling (ADR-0010)."
  - "No stored sourceHash is maintained for predicates (ADR-0013); predicate drift is not staleness-checked."

operations:
  validate_predicate_declarations:
    requires:
      - "contracts is the parsed contracts.json content including its top-level predicates map"
      - "config.sourceRoots is the set of source roots to resolve sourceRefs against"
    ensures:
      - "Every predicate name is a valid IDENT matching the predicate_call grammar naming (build-spec §4.1 IDENT); an invalid name produces an INVALID_PREDICATE_NAME hard error"
      - "Every predicate's source field is resolved under config.sourceRoots; an unresolvable source produces a PREDICATE_SOURCE_UNRESOLVED warning (resolve-or-warn, not a hard error)"
      - "The operation returns a structured result and never throws an unstructured exception (ADR-0010)"
    examples:
      - input: "validate_predicate_declarations(contracts with predicates.isAvailable.source = 'Inventory.isAvailable' that resolves)"
        output: "no predicate-related errors or warnings for isAvailable"
      - input: "validate_predicate_declarations(contracts with predicates.bad-name (hyphenated))"
        output: "hard error INVALID_PREDICATE_NAME for bad-name"
      - input: "validate_predicate_declarations(contracts with predicates.isAvailable.source = 'NonExistent.func' that does not resolve)"
        output: "warning PREDICATE_SOURCE_UNRESOLVED for isAvailable (non-blocking)"
  verify_predicate_reference:
    requires:
      - "predicateName is an identifier appearing in a parsed predicateCall node"
      - "predicates is the top-level predicates map from contracts.json"
    ensures:
      - "Returns the declared predicate entry when predicates[predicateName].verifiedPure === true"
      - "Returns a hard validation error when the entry is missing, or verifiedPure is false, or verifiedPure is absent (ADR-0006)"
    examples:
      - input: "verify_predicate_reference('isAvailable', { isAvailable: { verifiedPure: true, source: 'Inventory.isAvailable', params: [], paramTypes: [], returnType: 'boolean' } })"
        output: "the isAvailable entry"
      - input: "verify_predicate_reference('isAvailable', { isAvailable: { verifiedPure: false, ... } })"
        output: "hard error — the contract cannot reference an unverified predicate"

must:
  - "Maintain the top-level predicates map in contracts.json exactly per the build-spec §3.4 schema: each entry { source: string, params: string[], paramTypes: typeRef[], returnType: 'boolean', verifiedPure: boolean } (ADR-0013)."
  - "Verify every predicate declaration's name is a valid IDENT at validate time; invalid names are INVALID_PREDICATE_NAME hard errors."
  - "Resolve every predicate declaration's source field under config.sourceRoots at validate time; unresolvable sources produce PREDICATE_SOURCE_UNRESOLVED warnings (resolve-or-warn, ADR-0005, ADR-0013)."
  - "Set verifiedPure only through a human's manual lint/review: the author asserts purity as data in contracts.json (build-spec §14 default, ADR-0006); the tool itself never performs purity or termination analysis."
  - "Return structured results from every registry operation and never throw unstructured exceptions (ADR-0010)."
  - "Load the predicates map through the workspace-context shared loader whenever reading; never re-implement loading (build-spec §6)."

must_not:
  - "Must not perform automated purity or termination analysis to set verifiedPure — the flag is a human-set data field (ADR-0006, build-spec §14 default)."
  - "Must not default verifiedPure to true, or set it to true without a human's manual lint/review."
  - "Must not maintain a stored sourceHash for predicates (ADR-0013)."
  - "Must not provide a predicate registration CLI (register-predicate / verify-purity / remind-unverified) — predicate registration is part of authoring (ADR-0013)."
  - "Must not maintain a separate predicates.json file — predicates are declared inline in contracts.json (ADR-0013)."
  - "Must not parse or semantically validate contract expressions or predicate calls — that is contract-language's semantic validator (build-spec §5.1), reached through the joint loader (workspace-context)."
  - "Must not invoke an LLM anywhere in predicate-registry tooling (ADR-0010)."
  - "Must not hard-error on an unresolvable sourceRef — resolve-or-warn produces a PREDICATE_SOURCE_UNRESOLVED warning, not a hard error (ADR-0013)."

can:
  - "May surface the resolved sourceRef and derived hash for transparency via validate --verbose."
  - "May offer an inspection or listing view of declared predicates to aid authors."
  - "May include human-friendly hints in structured predicate-related errors."

limits:
  - "No parsing, AST construction, or semantic validation of predicate_calls in contract expressions — contract-language owns those; this context only stores and maintains the predicate data."
  - "No hard cross-referencing validation (a referenced predicate must exist with verifiedPure === true) — that is contract-language's semantic validator check, operating on the predicate data this context maintains."
  - "No joint loading of the .versailles/ file set — workspace-context owns the loader; predicate data is read through it."
  - "No manifest derivation from source — manifest-extraction owns that; predicate sourceRef resolution reuses static-analysis seams without becoming manifest derivation."
  - "No automated purity or termination analysis (ADR-0006, build-spec §14 default)."
  - "No staleness-check orchestration or exit-code semantics — workspace-context's check_staleness computes hash comparisons for manifests and contract operations; predicate sourceHash is dropped (ADR-0013)."
  - "No LLM client, prompt templates, or in-tool LLM invocation (ADR-0010)."

asserts:
  - "assert: every entry in the top-level predicates map of contracts.json has exactly the build-spec §3.4 fields with the declared types (source: string, params: string[], paramTypes: typeRef[], returnType: 'boolean', verifiedPure: boolean)."
  - "assert: validate_predicate_declarations emits INVALID_PREDICATE_NAME for every predicate name that is not a valid IDENT."
  - "assert: validate_predicate_declarations emits PREDICATE_SOURCE_UNRESOLVED (warning, not hard error) for every predicate whose source field does not resolve under config.sourceRoots."
  - "assert: verifiedPure is never auto-set to true by any code path; it is set only by a human's manual assertion in contracts.json."
  - "assert: verify_predicate_reference returns a hard error whenever a contract references a predicate with verifiedPure missing or false (ADR-0006)."
  - "assert: no code path in predicate-registry parses contract expressions or invokes an LLM."
  - "assert: no stored sourceHash is maintained for any predicate (ADR-0013)."

