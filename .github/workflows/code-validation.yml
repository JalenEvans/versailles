name: code-validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  code-validation:
    name: Code validation (lint, format, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome lint .

      - name: Format check
        run: bunx biome format .

      - name: Build
        run: bun run build

      - name: Smoke tests
        run: bun run smoke

      - name: All tests
        run: bun run test
