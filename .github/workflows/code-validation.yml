name: code-validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript validation — runs unconditionally on every PR / push.
  # Validates the full bun-workspaces monorepo:
  #   packages/core/        – shared TypeScript library
  #   packages/engine/      – contract engine
  #   packages/cli/         – CLI wrapper
  #   packages/frontend-ts/ – TypeScript frontend
  #   packages/ir/          – intermediate representation
  #   src/                  – root-level source
  #
  # Build emits: dist/packages/*/  and  dist/src/
  # Tests import from: packages/*/src  and  src/
  # ---------------------------------------------------------------------------
  code-validation:
    name: Code validation (lint, format, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome lint .

      - name: Format check
        run: bunx biome format .

      - name: Build
        run: bun run build

      - name: Smoke tests
        run: bun run smoke

      - name: All tests
        run: bun run test

  # ---------------------------------------------------------------------------
  # .NET validation — DORMANT until frontends/csharp/ is scaffolded.
  # ---------------------------------------------------------------------------
  # This gate runs on every call but the dotnet job below only executes
  # when files under frontends/csharp/ have changed.  Since that directory
  # does not yet exist, the dotnet job is permanently skipped today.
  #
  # When the C# front-end is added, update the placeholder commands
  # (dotnet build / dotnet test) to point at the correct solution or
  # project files inside frontends/csharp/.
  # ---------------------------------------------------------------------------
  detect-paths:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      csharp: ${{ steps.filter.outputs.csharp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required for dorny/paths-filter to diff
          # push events correctly (it compares commit SHAs).
          fetch-depth: 0

      - name: Detect frontends/csharp/ changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            csharp:
              - 'frontends/csharp/**'

  dotnet:
    name: .NET validation (frontends/csharp)
    needs: detect-paths
    if: needs.detect-paths.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: .NET SDK info
        run: dotnet --info

      # TODO: replace these placeholders with the actual solution / project
      # paths once frontends/csharp/ is scaffolded.
      - name: Build (placeholder)
        run: dotnet build frontends/csharp/

      - name: Test (placeholder)
        run: dotnet test frontends/csharp/
