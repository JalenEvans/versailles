# npm-publish — manually-triggered staged-publish pipeline for versailles-dbc.
#
# Trigger: workflow_dispatch only (no push / pull_request). Dispatch from the
# GitHub Actions UI on the `main` branch after a version-bump commit has been
# merged. npm rejects duplicate versions, so the commit must land before you
# dispatch.
#
# Access control (two gates):
#   1. Environment approval — the publish job runs under the `npm-publish`
#      GitHub environment, which should require manual approval.
#   2. Actor guard — the first step of the publish job fails unless the
#      triggering_actor is the repo owner (JalenEvans).
#
# Trusted Publisher (OIDC) — NO token, NO OTP, no auth file:
#   Auth uses npm Trusted Publishing (OIDC). The publish job grants
#   `id-token: write` and requires Node ≥ 22.14 / npm CLI ≥ 11.5.1 —
#   setup-node with Node 24 provides bundled npm 11. Publish emits `--provenance` attestations.
#   The npmjs.com Trusted Publisher for `versailles-dbc` must be configured
#   with owner `JalenEvans`, repo `versailles`, workflow source
#   `npm-publish.yml`, environment `npm-publish` — it will NOT publish
#   until that web-side configuration exists.
#
# Staged publishing flow:
#   This workflow stages the package with `npm stage publish` — direct
#   `npm publish` is forbidden by the stage-only Trusted Publisher permission
#   (returns 403 "OIDC permission denied for this action"). After staging,
#   the maintainer must approve the package with 2FA on npmjs.com (Staged
#   Packages tab) or via `npm stage approve <stage-id>` before the version
#   is publicly installable. The dist-tag is immutable on a staged package:
#   if the wrong tag was staged, run `npm stage reject <stage-id>` and
#   re-stage.

name: npm-publish

on:
  workflow_dispatch:
    branches: [main]
    inputs:
      dist_tag:
        description: npm dist-tag to publish under
        required: true
        default: latest
        type: choice
        options:
          - latest
          - beta
          - next
      dry_run:
        description: Preview the publish without writing to the registry
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    # workflow_call → code-validation.yml (lint, format, build, tests)
    name: Validate (lint, format, build, tests)
    uses: ./.github/workflows/code-validation.yml

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authorize trigger (owner-only)
        if: github.triggering_actor != 'JalenEvans'
        run: |
          echo "::error::npm publish is restricted to the repo owner (JalenEvans). Triggered by ${{ github.triggering_actor }}."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA-pinned — publish workflow; Dependabot keeps this current

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # SHA-pinned — publish workflow; Dependabot keeps this current

      - name: Setup Node (trusted publishing needs npm ≥ 11.5.1 — Node 24 bundles npm 11)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # SHA-pinned; Dependabot keeps this current
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stage publish (approve on npmjs.com)
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Fail-closed whitelist — only known dist-tags are allowed.
          case "${DIST_TAG}" in latest|beta|next) ;; *) echo "::error::invalid dist_tag: ${DIST_TAG}"; exit 1 ;; esac
          if [ "${DRY_RUN}" = "true" ]; then
            npm stage publish --tag "${DIST_TAG}" --provenance --dry-run
          else
            npm stage publish --tag "${DIST_TAG}" --provenance
          fi
