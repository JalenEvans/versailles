name: docs-validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Docs drift + contract validity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docs drift
        run: scripts/validate-docs.sh

      - name: Validate contracts
        run: scripts/validate-contracts.sh

  code:
    name: Code validation (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome check .

      - name: Test
        run: bun test

      - name: Build
        run: bun run build